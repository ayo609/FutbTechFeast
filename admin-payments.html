<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Verification — FUTB TechFest 2.0 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue:#060E1A;--navy:#0B1D3A;--navy-light:#142D5E;
            --teal:#0D9488;--teal-light:#14B8A6;--teal-pale:#CCFBF1;
            --sky:#38BDF8;--sky-light:#7DD3FC;--sky-pale:#E0F2FE;
            --white:#FFFFFF;--crimson:#EF4444;--green:#10B981;--orange:#F59E0B;--amber:#FBBF24;
            --card:rgba(11,29,58,0.55);--glass:rgba(255,255,255,0.04);
            --border:rgba(56,189,248,0.15);--border-teal:rgba(20,184,166,0.4);
            --text:#E2E8F0;--text-bright:#F8FAFC;--muted:#94A3B8;--muted-light:#CBD5E1;
            --shadow-teal:0 0 30px rgba(20,184,166,0.15);
            --shadow-card:0 8px 40px rgba(0,0,0,0.3);
            --radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--teal) var(--deep-blue)}
        html::-webkit-scrollbar{width:5px}
        html::-webkit-scrollbar-track{background:var(--deep-blue)}
        html::-webkit-scrollbar-thumb{background:var(--teal);border-radius:3px}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--deep-blue);color:var(--text);
            min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;
        }
        body::before{
            content:'';position:fixed;inset:0;z-index:0;
            background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(56,189,248,0.08) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 50% at 90% 100%,rgba(20,184,166,0.05) 0%,transparent 55%);
            pointer-events:none;
        }
        .sidebar{
            width:260px;min-height:100vh;background:rgba(6,14,26,0.9);backdrop-filter:blur(20px);
            border-right:1px solid var(--border);padding:1.5rem 0;position:fixed;top:0;left:0;bottom:0;
            z-index:200;display:flex;flex-direction:column;transition:transform var(--transition);
        }
        .sidebar-logo{
            font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:0.08em;
            background:linear-gradient(135deg,var(--teal-light),var(--sky-light));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;text-decoration:none;padding:0 1.5rem 1.5rem;display:block;
        }
        .sidebar-nav{flex:1;overflow-y:auto;padding:0 0.8rem}
        .sidebar-section{font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);padding:1rem 0.7rem 0.5rem;font-family:'JetBrains Mono',monospace}
        .sidebar a{display:flex;align-items:center;gap:0.7rem;padding:0.65rem 0.8rem;border-radius:var(--radius-sm);color:var(--muted);text-decoration:none;font-size:0.8rem;font-weight:500;transition:all var(--transition);letter-spacing:0.03em;position:relative}
        .sidebar a:hover{background:rgba(20,184,166,0.06);color:var(--text-bright)}
        .sidebar a.active{background:rgba(20,184,166,0.1);color:var(--teal-light);border-left:3px solid var(--teal-light)}
        .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid var(--border)}
        .sidebar-footer a{color:var(--crimson);text-decoration:none;font-size:0.75rem;display:flex;align-items:center;gap:0.5rem;font-weight:500}
        .main-content{flex:1;margin-left:260px;position:relative;z-index:1}
        .top-bar{
            position:sticky;top:0;z-index:100;background:rgba(6,14,26,0.85);backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;
            justify-content:space-between;height:60px;
        }
        .top-bar-left{display:flex;align-items:center;gap:1rem}
        .hamburger-btn{display:none;background:none;border:none;color:var(--text-bright);font-size:1.5rem;cursor:pointer}
        .admin-pill{display:flex;align-items:center;gap:0.5rem;cursor:pointer;padding:4px 10px 4px 4px;border-radius:100px;background:var(--glass);border:1px solid var(--border);transition:all var(--transition)}
        .admin-pill:hover{border-color:var(--border-teal)}
        .admin-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.7rem;font-family:'JetBrains Mono',monospace}
        .admin-name{font-size:0.78rem;font-weight:600;color:var(--text-bright)}
        .dropdown{position:absolute;top:50px;right:0;background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius);padding:0.4rem 0;min-width:180px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:all var(--transition);z-index:300;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
        .dropdown.active{opacity:1;visibility:visible;transform:translateY(0)}
        .dropdown a,.dropdown button{display:flex;align-items:center;gap:0.5rem;width:100%;text-align:left;padding:0.6rem 1.2rem;color:var(--muted-light);font-size:0.78rem;background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all var(--transition)}
        .dropdown a:hover,.dropdown button:hover{background:rgba(20,184,166,0.06);color:var(--text-bright)}
        .dropdown .logout-btn{color:var(--crimson)}.dropdown .logout-btn:hover{color:#FCA5A5}

        .page-content{padding:2rem}
        .page-header{margin-bottom:1.5rem}
        .page-header h1{font-size:1.5rem;font-weight:700;color:var(--text-bright);margin-bottom:0.3rem}
        .page-header p{font-size:0.82rem;color:var(--muted)}
        .pending-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--crimson);animation:pulse-dot 1s infinite;margin-right:0.4rem}
        @keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

        .tab-bar{display:flex;gap:0.4rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .tab-btn{padding:0.6rem 1.2rem;border-radius:100px;font-size:0.78rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--glass);color:var(--muted);transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .tab-btn:hover,.tab-btn.active{border-color:var(--teal-light);color:var(--teal-light);background:rgba(20,184,166,0.08)}
        .tab-btn .count{font-family:'JetBrains Mono',monospace;font-size:0.65rem;margin-left:0.3rem}

        .filter-bar{display:flex;gap:0.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
        .filter-bar input,.filter-bar select{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-bright);padding:0.5rem 0.9rem;border-radius:100px;font-size:0.75rem;font-family:'Space Grotesk',sans-serif;transition:all var(--transition)}
        .filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:var(--teal-light)}
        .filter-bar select option{background:var(--navy);color:var(--text-bright)}
        .filter-bar input{width:200px}

        .payment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1rem;margin-bottom:1.5rem}
        .payment-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;transition:all var(--transition);display:flex;gap:1rem}
        .payment-card:hover{border-color:var(--border-teal)}
        .proof-img{cursor:pointer;border-radius:var(--radius-sm);border:1px solid var(--border);transition:all var(--transition)}
        .proof-img:hover{border-color:var(--teal-light);transform:scale(1.02)}
        .payment-details{flex:1}
        .payment-details h4{font-size:0.85rem;font-weight:600;color:var(--text-bright);margin-bottom:0.3rem}
        .payment-details p{font-size:0.72rem;color:var(--muted-light);margin:0.15rem 0}
        .payment-actions{display:flex;gap:0.5rem;margin-top:0.8rem}
        .btn-approve{background:var(--green);color:white;border:none;padding:0.45rem 1rem;border-radius:100px;font-size:0.72rem;font-weight:700;cursor:pointer;transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .btn-approve:hover{background:#059669}
        .btn-reject{background:transparent;color:var(--crimson);border:1px solid rgba(239,68,68,0.4);padding:0.45rem 1rem;border-radius:100px;font-size:0.72rem;font-weight:600;cursor:pointer;transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .btn-reject:hover{background:rgba(239,68,68,0.1)}
        .btn-approve-all{background:var(--green);color:white;border:none;padding:0.6rem 1.5rem;border-radius:100px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;margin-bottom:1rem;transition:all var(--transition)}
        .btn-approve-all:hover{background:#059669}

        .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
        table{width:100%;border-collapse:collapse;min-width:800px}
        th{background:rgba(6,14,26,0.6);padding:0.7rem 0.8rem;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
        td{padding:0.7rem 0.8rem;font-size:0.78rem;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--muted-light)}
        tr:hover td{background:rgba(255,255,255,0.02)}
        .status-badge{padding:0.2rem 0.6rem;border-radius:100px;font-size:0.6rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;display:inline-block}
        .status-confirmed{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:var(--green)}
        .status-delivered{background:rgba(20,184,166,0.12);border:1px solid rgba(20,184,166,0.3);color:var(--teal-light)}

        .lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition);cursor:pointer}
        .lightbox.active{opacity:1;visibility:visible}
        .lightbox img{max-width:90vw;max-height:90vh;border-radius:var(--radius);border:2px solid var(--border-teal)}

        .pagination{display:flex;align-items:center;justify-content:center;gap:0.4rem;margin-top:1.5rem;flex-wrap:wrap}
        .pagination button{padding:0.4rem 0.8rem;border-radius:var(--radius-sm);font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--glass);color:var(--muted);transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .pagination button:hover,.pagination button.active{border-color:var(--teal-light);color:var(--teal-light);background:rgba(20,184,166,0.08)}
        .pagination button:disabled{opacity:0.3;cursor:not-allowed}
        .pagination .page-info{font-size:0.78rem;color:var(--muted)}

        .modal-overlay{position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition);padding:1rem}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-box{background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius-lg);padding:2rem;max-width:440px;width:100%;position:relative;box-shadow:0 30px 70px rgba(0,0,0,0.6);text-align:center}
        .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer}
        .modal-box h3{font-size:1.1rem;font-weight:700;color:var(--text-bright);margin-bottom:0.8rem}
        .modal-box p{color:var(--muted-light);font-size:0.82rem;margin-bottom:1rem}
        .btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);padding:0.7rem 1.5rem;border-radius:100px;font-weight:700;font-size:0.82rem;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif}
        .btn-danger{background:var(--crimson);color:white;padding:0.7rem 1.5rem;border-radius:100px;font-weight:700;font-size:0.82rem;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid var(--border-teal);color:var(--text-bright);padding:0.7rem 1.5rem;border-radius:100px;font-size:0.8rem;font-weight:500;z-index:500;opacity:0;visibility:hidden;transition:all var(--transition);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
        .toast.show{opacity:1;visibility:visible;bottom:40px}

        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
            .main-content{margin-left:0}.hamburger-btn{display:block}
            .page-content{padding:1.5rem 1rem}.payment-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <a href="admin.html" class="sidebar-logo">TechFest Admin</a>
        <nav class="sidebar-nav">
            <div class="sidebar-section">Main</div><a href="admin.html">📊 Dashboard</a>
            <div class="sidebar-section">Management</div><a href="admin-users.html">👥 Users</a><a href="admin-orders.html">🛍️ Orders</a><a href="admin-payments.html" class="active">💳 Payments</a>
            <div class="sidebar-section">Content</div><a href="admin-schedule.html">📅 Schedule</a><a href="admin-announcements.html">📢 Announcements</a><a href="admin-notifications.html">🔔 Notifications</a><a href="admin-merchandise.html">🛍️ Merchandise</a>
            <div class="sidebar-section">System</div><a href="admin-analytics.html">📊 Analytics</a><a href="admin-settings.html">⚙️ Settings</a><a href="admin-activity-log.html">📜 Activity Log</a>
        </nav>
        <div class="sidebar-footer"><a href="index.html" target="_blank">🔗 View Site</a></div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <div class="top-bar-left"><button class="hamburger-btn" id="hamburgerBtn">☰</button></div>
            <div class="top-bar-right">
                <div style="position:relative">
                    <div class="admin-pill" id="adminPill"><div class="admin-avatar" id="adminAvatar">A</div><span class="admin-name" id="adminName">Admin</span></div>
                    <div class="dropdown" id="adminDropdown"><a href="admin-settings.html">⚙️ Settings</a><button class="logout-btn" id="logoutBtn">🚪 Logout</button></div>
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="page-header"><h1>💳 Payment Verification</h1><p>Review and approve payment proofs · <span class="pending-dot"></span> <strong style="color:var(--crimson);" id="pendingCount">0</strong> pending</p></div>

            <div class="tab-bar">
                <button class="tab-btn active" data-tab="pending">⏳ Pending<span class="count" id="tabPending">0</span></button>
                <button class="tab-btn" data-tab="approved">✅ Approved<span class="count" id="tabApproved">0</span></button>
                <button class="tab-btn" data-tab="all">📋 All<span class="count" id="tabAll">0</span></button>
            </div>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search tracking ID...">
                <select id="filterItem"><option value="">All Items</option><option value="tshirt">👕 T-Shirt</option><option value="cap">🧢 Cap</option><option value="jotter">📓 Jotter</option><option value="bag">👜 Bag</option></select>
                <button class="btn-approve-all" id="btnApproveAll" style="display:none">✅ Approve All Pending</button>
            </div>

            <div id="contentArea"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')"><img id="lightboxImg" src="" alt="Proof"></div>
    <div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, where, getDocs, onSnapshot, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig={apiKey:"AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",authDomain:"futbtechfeast.firebaseapp.com",projectId:"futbtechfeast",storageBucket:"futbtechfeast.firebasestorage.app",messagingSenderId:"64095326173",appId:"1:64095326173:web:3f7cda8b0040ab2ea53034"};
        const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
        window.firebaseAuth=auth;window.firebaseDb=db;window.firebaseSignOut=signOut;window.firebaseDoc=doc;window.firebaseGetDoc=getDoc;window.firebaseCollection=collection;window.firebaseQuery=query;window.firebaseOrderBy=orderBy;window.firebaseWhere=where;window.firebaseGetDocs=getDocs;window.firebaseOnSnapshot=onSnapshot;window.firebaseUpdateDoc=updateDoc;window.firebaseAddDoc=addDoc;window.firebaseServerTimestamp=serverTimestamp;
        console.log("✅ Firebase Admin initialized");
    </script>

    <script>
        let currentAdmin=null,allOrders=[],currentTab='pending',currentPage=1,pageSize=12;
        const sidebar=document.getElementById('sidebar'),hamburgerBtn=document.getElementById('hamburgerBtn'),adminAvatar=document.getElementById('adminAvatar'),adminName=document.getElementById('adminName'),adminDropdown=document.getElementById('adminDropdown'),modalOverlay=document.getElementById('modalOverlay'),modalBox=document.getElementById('modalBox'),toast=document.getElementById('toast'),lightbox=document.getElementById('lightbox'),lightboxImg=document.getElementById('lightboxImg');

        hamburgerBtn.addEventListener('click',()=>sidebar.classList.toggle('open'));
        document.addEventListener('click',(e)=>{if(!e.target.closest('#sidebar')&&!e.target.closest('#hamburgerBtn')&&sidebar.classList.contains('open'))sidebar.classList.remove('open')});
        document.getElementById('adminPill').addEventListener('click',()=>adminDropdown.classList.toggle('active'));
        document.addEventListener('click',(e)=>{if(!e.target.closest('#adminPill')&&!e.target.closest('#adminDropdown'))adminDropdown.classList.remove('active')});
        document.getElementById('logoutBtn').addEventListener('click',async()=>{await window.firebaseSignOut(window.firebaseAuth);window.location.href='admin-login.html'});

        function waitForFirebase(cb){if(window.firebaseOnSnapshot&&window.firebaseAuth){cb()}else{setTimeout(()=>waitForFirebase(cb),150)}}
        waitForFirebase(()=>{window.firebaseOnAuthStateChanged(window.firebaseAuth,async(user)=>{if(!user){window.location.href='admin-login.html';return}const ad=await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDb,'admins',user.uid));if(!ad.exists()||ad.data().role!=='admin'){await window.firebaseSignOut(window.firebaseAuth);window.location.href='admin-login.html';return}currentAdmin=user;adminAvatar.textContent=(ad.data().name||'A').charAt(0).toUpperCase();adminName.textContent=ad.data().name||'Admin';loadOrders()})});

        function loadOrders(){window.firebaseOnSnapshot(window.firebaseQuery(window.firebaseCollection(window.firebaseDb,'merchandise_orders'),window.firebaseOrderBy('createdAt','desc')),(snap)=>{allOrders=[];snap.forEach(doc=>allOrders.push({id:doc.id,...doc.data()}));updateCounts();renderContent()})}

        function updateCounts(){const pending=allOrders.filter(o=>o.status==='proof_sent').length,approved=allOrders.filter(o=>o.status==='confirmed'||o.status==='delivered').length;document.getElementById('pendingCount').textContent=pending;document.getElementById('tabPending').textContent=pending;document.getElementById('tabApproved').textContent=approved;document.getElementById('tabAll').textContent=allOrders.length}

        document.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');currentTab=this.dataset.tab;currentPage=1;renderContent()})});
        document.getElementById('searchInput').addEventListener('input',debounce(()=>{currentPage=1;renderContent()},300));
        document.getElementById('filterItem').addEventListener('change',()=>{currentPage=1;renderContent()});
        document.getElementById('btnApproveAll').addEventListener('click',async()=>{const pending=allOrders.filter(o=>o.status==='proof_sent');for(const o of pending){await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb,'merchandise_orders',o.id),{status:'confirmed'})}showToast('All pending payments approved!')});

        function renderContent(){
            const search=document.getElementById('searchInput').value.toLowerCase(),fi=document.getElementById('filterItem').value;
            let filtered=allOrders.filter(o=>{if(search&&!((o.trackingId||'').toLowerCase().includes(search)&&(o.customName||'').toLowerCase().includes(search)))return false;if(fi&&o.itemType!==fi)return false;return true});
            if(currentTab==='pending')filtered=filtered.filter(o=>o.status==='proof_sent');
            else if(currentTab==='approved')filtered=filtered.filter(o=>o.status==='confirmed'||o.status==='delivered');

            document.getElementById('btnApproveAll').style.display=(currentTab==='pending'&&filtered.length>0)?'inline-block':'none';
            document.getElementById('pagination').innerHTML='';

            if(currentTab==='pending'){
                const start=(currentPage-1)*pageSize,end=start+pageSize,pageData=filtered.slice(start,end);const im={tshirt:'👕',cap:'🧢',jotter:'📓',bag:'👜'};
                document.getElementById('contentArea').innerHTML=pageData.length===0?'<p style="color:var(--muted);text-align:center;padding:3rem;">No pending payments 🎉</p>':'<div class="payment-grid">'+pageData.map(o=>'<div class="payment-card"><img src="'+(o.paymentProofBase64||'')+'" alt="Proof" style="width:140px;height:180px;object-fit:cover;" class="proof-img" onclick="openLightbox(\''+o.id+'\')"><div class="payment-details"><h4>📦 '+(o.trackingId||'—')+'</h4><p>'+(im[o.itemType]||'📦')+' '+(o.itemName||'—')+'</p><p>Size: '+(o.size||'—')+' · Qty: '+o.quantity+'</p><p>Custom Name: '+(o.customName||'—')+'</p><p style="color:var(--teal-light);font-weight:700;">₦'+(o.totalPrice?.toLocaleString()||'0')+'</p><p style="font-size:0.65rem;">Uploaded: '+((o.paymentProofUploadedAt?new Date(o.paymentProofUploadedAt):new Date()).toLocaleString())+'</p><div class="payment-actions"><button class="btn-approve" onclick="approvePayment(\''+o.id+'\')">✅ Approve</button><button class="btn-reject" onclick="rejectPayment(\''+o.id+'\')">❌ Reject</button></div></div></div>').join('')+'</div>';
                renderPagination(filtered.length,pageSize);
            }else{
                const start=(currentPage-1)*20,end=start+20,pageData=filtered.slice(start,end);const im={tshirt:'👕',cap:'🧢',jotter:'📓',bag:'👜'};
                document.getElementById('contentArea').innerHTML=pageData.length===0?'<p style="color:var(--muted);text-align:center;padding:3rem;">No payments found</p>':'<div class="table-wrap"><table><thead><tr><th>Tracking ID</th><th>Customer</th><th>Item</th><th>Total</th><th>Status</th><th>Date</th><th>Proof</th></tr></thead><tbody>'+pageData.map(o=>'<tr><td style="font-family:JetBrains Mono,monospace;font-size:0.7rem;color:var(--teal-light);">'+(o.trackingId||'—')+'</td><td>'+(o.customName||'—')+'</td><td>'+(im[o.itemType]||'📦')+' '+(o.itemName||'—')+'</td><td style="color:var(--teal-light);font-weight:600;">₦'+(o.totalPrice?.toLocaleString()||'0')+'</td><td><span class="status-badge status-'+(o.status||'pending')+'">'+(o.status||'—').replace(/_/g,' ')+'</span></td><td style="font-size:0.7rem;">'+((o.createdAt?.toDate?.()||new Date()).toLocaleDateString())+'</td><td>'+(o.paymentProofBase64?'<button class="btn-approve" style="font-size:0.65rem;padding:0.25rem 0.6rem;" onclick="openLightbox(\''+o.id+'\')">👁️ View</button>':'—')+'</td></tr>').join('')+'</tbody></table></div>';
                renderPagination(filtered.length,20);
            }
        }

        function renderPagination(total,size){const tp=Math.ceil(total/size);let h='<button '+(currentPage===1?'disabled':'')+' onclick="goToPage('+(currentPage-1)+')">← Prev</button>';for(let i=1;i<=tp;i++){if(i===1||i===tp||Math.abs(i-currentPage)<=2)h+='<button class="'+(i===currentPage?'active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';else if(!h.endsWith('...'))h+='<span style="color:var(--muted);padding:0 0.3rem;">...</span>'}h+='<button '+(currentPage===tp?'disabled':'')+' onclick="goToPage('+(currentPage+1)+')">Next →</button>';h+='<span class="page-info">Showing '+((currentPage-1)*size+1)+'-'+Math.min(currentPage*size,total)+' of '+total+'</span>';document.getElementById('pagination').innerHTML=tp>1?h:''}
        function goToPage(p){currentPage=p;renderContent();window.scrollTo({top:0,behavior:'smooth'})}

        async function approvePayment(id){await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb,'merchandise_orders',id),{status:'confirmed'});showToast('Payment approved! ✅')}
        function rejectPayment(id){modalBox.innerHTML='<button class="modal-close" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'active\')">✕</button><h3>❌ Reject Payment?</h3><p>The user will need to upload new proof.</p><button class="btn-danger" id="btnConfirmReject">Reject Payment</button><button class="btn-primary" style="margin-top:0.5rem;background:transparent;border:1px solid var(--border);color:var(--text-bright);" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'active\')">Cancel</button>';modalOverlay.classList.add('active');document.getElementById('btnConfirmReject').addEventListener('click',async()=>{await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb,'merchandise_orders',id),{status:'pending_payment',paymentProofBase64:null,paymentProofFileName:null});modalOverlay.classList.remove('active');showToast('Payment rejected')})}

        function openLightbox(id){const o=allOrders.find(o=>o.id===id);if(!o||!o.paymentProofBase64)return;lightboxImg.src=o.paymentProofBase64;lightbox.classList.add('active')}
        document.addEventListener('keydown',function(e){if(e.key==='Escape'){lightbox.classList.remove('active');modalOverlay.classList.remove('active')}});
        modalOverlay.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active')});

        function showToast(m,d=3000){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),d)}
        function debounce(fn,d){let t;return function(...args){clearTimeout(t);t=setTimeout(()=>fn.apply(this,args),d)}}

        window.approvePayment=approvePayment;window.rejectPayment=rejectPayment;window.openLightbox=openLightbox;window.goToPage=goToPage;
    </script>
</body>
</html>
