<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Payment Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue:#060E1A;--navy:#0B1D3A;--navy-light:#142D5E;
            --teal:#0D9488;--teal-light:#14B8A6;
            --sky:#38BDF8;--sky-light:#7DD3FC;
            --white:#FFFFFF;--crimson:#EF4444;--green:#10B981;
            --card:rgba(11,29,58,0.55);--border:rgba(56,189,248,0.2);
            --text:#E2E8F0;--text-bright:#F8FAFC;--muted:#94A3B8;
            --radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--deep-blue);color:var(--text);
            min-height:100vh;-webkit-font-smoothing:antialiased;
        }
        .top-nav{
            position:sticky;top:0;z-index:100;background:rgba(6,14,26,0.85);
            backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:0 5%;
            display:flex;align-items:center;justify-content:space-between;height:64px;
        }
        .nav-logo{font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:0.08em;background:linear-gradient(135deg,var(--teal-light),var(--sky-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
        .nav-badge { background: var(--crimson); color: white; font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 12px; font-weight: bold; }

        .main-content{max-width:1000px;margin:0 auto;padding:2rem 5%}
        .page-header{margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center}
        .page-title{font-size:1.6rem;font-weight:700;color:var(--text-bright);}
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .order-card{
            background:var(--card);border:1px solid var(--border);
            border-radius:var(--radius-lg);padding:1.5rem;
            display:flex;flex-direction:column;gap:1rem;
        }
        .order-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .order-item { font-weight: 700; color: var(--sky-light); font-size: 1.1rem; }
        .order-amount { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--green); }
        
        .order-details { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
        .order-details strong { color: var(--text-bright); font-weight: 500; }

        .receipt-preview {
            width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-sm);
            border: 1px dashed var(--border); cursor: pointer; transition: var(--transition);
        }
        .receipt-preview:hover { border-color: var(--teal-light); opacity: 0.9; }

        .action-row { display: flex; gap: 0.5rem; margin-top: auto; }
        .btn {
            flex: 1; padding: 0.7rem; border-radius: var(--radius-sm); font-family: inherit;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all var(--transition); border: none; color: white;
        }
        .btn-approve { background: var(--green); }
        .btn-approve:hover { background: #0ea5e9; }
        .btn-reject { background: transparent; border: 1px solid var(--crimson); color: var(--crimson); }
        .btn-reject:hover { background: var(--crimson); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Fullscreen Image Modal */
        .modal-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:1000;
            display:none;align-items:center;justify-content:center;padding:1rem;
        }
        .modal-img { max-width: 100%; max-height: 90vh; border-radius: var(--radius-sm); }
        .close-modal { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; }

        .empty-state { text-align: center; padding: 3rem; color: var(--muted); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="#" class="nav-logo">TechFest Admin</a>
        <div style="display:flex; align-items:center; gap:10px;">
            <span class="nav-badge" id="pendingCount">0 Pending</span>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">Pending Verifications</h1>
            <button class="btn btn-approve" style="width:auto; padding:0.5rem 1rem;" onclick="loadPendingOrders()">🔄 Refresh</button>
        </div>

        <div class="grid-container" id="ordersGrid">
            <div class="empty-state">Loading pending transactions...</div>
        </div>
    </div>

    <div class="modal-overlay" id="imageModal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img src="" class="modal-img" id="fullSizeImage" onclick="event.stopPropagation()">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        // Use your exact config
        const firebaseConfig = {
            apiKey: "AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",
            authDomain: "futbtechfeast.firebaseapp.com",
            projectId: "futbtechfeast",
            storageBucket: "futbtechfeast.firebasestorage.app",
            messagingSenderId: "64095326173",
            appId: "1:64095326173:web:3f7cda8b0040ab2ea53034"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ordersGrid = document.getElementById('ordersGrid');
        const pendingCount = document.getElementById('pendingCount');

        // Make functions globally available for inline HTML onclick handlers
        window.loadPendingOrders = async function() {
            ordersGrid.innerHTML = `<div class="empty-state">Fetching latest data...</div>`;
            
            try {
                // Query for orders where the proof has been sent but not yet approved
                const q = query(collection(db, "merchandise_orders"), where("status", "==", "proof_sent"));
                const querySnapshot = await getDocs(q);
                
                ordersGrid.innerHTML = "";
                pendingCount.innerText = `${querySnapshot.size} Pending`;

                if (querySnapshot.empty) {
                    ordersGrid.innerHTML = `<div class="empty-state">🎉 All caught up! No pending payments to verify.</div>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const orderId = docSnap.id;
                    
                    // Fallback formatting just in case
                    const itemName = data.itemName || data.ticketTierField || "Unknown Item";
                    const amount = data.amount || data.totalPrice || 0;
                    const sender = data.senderAccountName || "Not Provided";
                    const ref = data.paymentRef || data.trackingId || "No Ref";
                    const receiptBase64 = data.receiptImageBase64 || "";

                    // Construct the HTML for the card
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <div class="order-header">
                            <div class="order-item">${itemName}</div>
                            <div class="order-amount">₦${amount.toLocaleString()}</div>
                        </div>
                        <div class="order-details">
                            <div><strong>Sender:</strong> ${sender}</div>
                            <div><strong>Ref ID:</strong> ${ref}</div>
                            <div><strong>Order ID:</strong> ${orderId.substring(0,8)}...</div>
                        </div>
                        ${receiptBase64 ? 
                            `<img src="${receiptBase64}" class="receipt-preview" onclick="openModal('${receiptBase64}')" title="Click to enlarge" alt="Receipt">` : 
                            `<div class="empty-state" style="padding:1rem; border:1px dashed var(--border);">No Image Attached</div>`
                        }
                        <div class="action-row">
                            <button class="btn btn-reject" id="rej-${orderId}" onclick="updateStatus('${orderId}', 'rejected')">Reject</button>
                            <button class="btn btn-approve" id="app-${orderId}" onclick="updateStatus('${orderId}', 'approved')">Verify & Approve</button>
                        </div>
                    `;
                    ordersGrid.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching orders:", error);
                ordersGrid.innerHTML = `<div class="empty-state" style="color:var(--crimson)">Error loading orders. Check console.</div>`;
            }
        };

        window.updateStatus = async function(orderId, newStatus) {
            const isConfirmed = confirm(`Are you sure you want to mark this order as ${newStatus.toUpperCase()}?`);
            if (!isConfirmed) return;

            const appBtn = document.getElementById(`app-${orderId}`);
            const rejBtn = document.getElementById(`rej-${orderId}`);
            if(appBtn) appBtn.disabled = true;
            if(rejBtn) rejBtn.disabled = true;

            try {
                const orderRef = doc(db, "merchandise_orders", orderId);
                await updateDoc(orderRef, {
                    status: newStatus,
                    verifiedAt: new Date()
                });
                
                // Refresh the grid to remove the processed item
                loadPendingOrders();
            } catch (error) {
                console.error("Error updating status:", error);
                alert("Failed to update order status.");
                if(appBtn) appBtn.disabled = false;
                if(rejBtn) rejBtn.disabled = false;
            }
        };

        // Modal Functions
        window.openModal = function(base64Src) {
            document.getElementById('fullSizeImage').src = base64Src;
            document.getElementById('imageModal').style.display = 'flex';
        };
        
        window.closeModal = function() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('fullSizeImage').src = "";
        };

        // Load initially
        loadPendingOrders();
    </script>
</body>
</html>
