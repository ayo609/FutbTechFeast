<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registration — FUTB TechFest 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0D2B4E;
            --navy-deep: #06182B;
            --gold: #C8960C;
            --gold-light: #F0B429;
            --gold-pale: #FCEABB;
            --blue: #1565C0;
            --crimson: #B71C1C;
            --green: #00C853;
            --orange: #FF9800;
            --dark: #080F1A;
            --darker: #040810;
            --card: rgba(13, 43, 78, 0.55);
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(200, 150, 12, 0.2);
            --border-gold: rgba(200, 150, 12, 0.4);
            --text: #E8F0FF;
            --text-bright: #FFFFFF;
            --muted: #8899BB;
            --muted-light: #A0B0CC;
            --shadow-gold: 0 0 30px rgba(200, 150, 12, 0.15);
            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.3);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) var(--darker);
        }
        html::-webkit-scrollbar {
            width: 6px;
        }
        html::-webkit-scrollbar-track {
            background: var(--darker);
        }
        html::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 3px;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }

        /* ── TOP NAV ── */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(4, 8, 16, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .back-btn {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            transition: color var(--transition);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .back-btn:hover {
            color: var(--gold-light);
        }
        .nav-logo {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--navy-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
        }
        .user-avatar:hover {
            border-color: var(--gold-light);
            box-shadow: 0 0 20px rgba(200, 150, 12, 0.3);
        }

        /* ── MAIN CONTENT ── */
        .main-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem 5%;
        }
        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 0.3rem;
        }
        .page-subtitle {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        /* ── STATUS BANNER ── */
        .status-banner {
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            border: 1px solid;
        }
        .status-banner.pending {
            background: rgba(255, 152, 0, 0.08);
            border-color: rgba(255, 152, 0, 0.3);
        }
        .status-banner.confirmed {
            background: rgba(0, 200, 83, 0.08);
            border-color: rgba(0, 200, 83, 0.3);
        }
        .status-banner.shortlisted {
            background: rgba(21, 101, 192, 0.08);
            border-color: rgba(21, 101, 192, 0.3);
        }
        .status-banner.selected {
            background: rgba(200, 150, 12, 0.08);
            border-color: rgba(200, 150, 12, 0.3);
        }
        .status-banner.cancelled {
            background: rgba(183, 28, 28, 0.08);
            border-color: rgba(183, 28, 28, 0.3);
        }
        .status-icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .pending .status-icon-wrap {
            background: rgba(255, 152, 0, 0.15);
        }
        .confirmed .status-icon-wrap {
            background: rgba(0, 200, 83, 0.15);
        }
        .shortlisted .status-icon-wrap {
            background: rgba(21, 101, 192, 0.15);
        }
        .selected .status-icon-wrap {
            background: rgba(200, 150, 12, 0.15);
        }
        .cancelled .status-icon-wrap {
            background: rgba(183, 28, 28, 0.15);
        }
        .status-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-bright);
            margin-bottom: 0.2rem;
        }
        .status-info p {
            font-size: 0.8rem;
            color: var(--muted-light);
            line-height: 1.5;
        }

        /* ── DETAIL CARDS ── */
        .detail-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.2rem;
        }
        .detail-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
        }
        .detail-card-header h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .edit-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.35rem 0.9rem;
            border-radius: 100px;
            font-size: 0.7rem;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.05em;
            transition: all var(--transition);
        }
        .edit-btn:hover {
            border-color: var(--gold);
            color: var(--gold-light);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.55rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.84rem;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: var(--muted);
            min-width: 120px;
        }
        .detail-value {
            color: var(--text-bright);
            font-weight: 500;
            text-align: right;
        }
        .detail-value.editable {
            cursor: pointer;
            border-bottom: 1px dashed var(--border);
        }
        .inline-edit {
            display: none;
            gap: 0.4rem;
            align-items: center;
        }
        .inline-edit.active {
            display: flex;
        }
        .inline-edit input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-bright);
            padding: 0.4rem 0.7rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-family: 'Space Grotesk', sans-serif;
            width: 140px;
        }
        .inline-edit input:focus {
            outline: none;
            border-color: var(--gold);
        }
        .inline-save,
        .inline-cancel {
            padding: 0.35rem 0.7rem;
            border-radius: 100px;
            font-size: 0.7rem;
            cursor: pointer;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
        }
        .inline-save {
            background: var(--gold);
            color: var(--navy-deep);
        }
        .inline-cancel {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        /* ── CHECKLIST ── */
        .checklist {
            list-style: none;
        }
        .checklist li {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.55rem 0;
            font-size: 0.82rem;
            color: var(--muted-light);
        }
        .checklist li.done {
            color: var(--green);
        }
        .checklist li .check-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }
        .progress-bar-wrap {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            height: 4px;
            margin: 0.8rem 0 1.2rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 100px;
            transition: width 0.6s ease;
        }

        /* ── BUTTONS ── */
        .btn-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--navy-deep);
            padding: 0.8rem 1.8rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all var(--transition);
            font-family: 'Space Grotesk', sans-serif;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 6px 25px rgba(200, 150, 12, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(200, 150, 12, 0.45);
        }
        .btn-danger {
            background: transparent;
            border: 1.5px solid rgba(183, 28, 28, 0.5);
            color: #EF5350;
            padding: 0.8rem 1.8rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: all var(--transition);
            font-family: 'Space Grotesk', sans-serif;
        }
        .btn-danger:hover {
            background: rgba(183, 28, 28, 0.1);
            border-color: #EF5350;
        }
        .btn-wa {
            background: #25D366;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: 0.04em;
            transition: all var(--transition);
            font-family: 'Space Grotesk', sans-serif;
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.25);
        }
        .btn-wa:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(37, 211, 102, 0.45);
        }

        /* ── LOADING SKELETON ── */
        .skeleton {
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            animation: pulse 1.5s infinite;
        }
        .skeleton-text {
            height: 14px;
            margin: 8px 0;
            width: 80%;
        }
        .skeleton-text.short {
            width: 50%;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* ── BOTTOM NAV ── */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(4, 8, 16, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
            padding: 0.6rem 5%;
            justify-content: space-around;
            align-items: center;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            text-decoration: none;
            color: var(--muted);
            font-size: 1.3rem;
            transition: all var(--transition);
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
        }
        .bottom-nav a.active {
            color: var(--gold-light);
            background: rgba(200, 150, 12, 0.1);
        }
        .bottom-nav a span {
            font-size: 0.6rem;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition);
            padding: 1rem;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: var(--navy);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
            transform: translateY(20px);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }
        .modal-icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            font-size: 2rem;
        }
        .modal-icon-wrap.success {
            background: rgba(0, 200, 83, 0.12);
            border: 2px solid rgba(0, 200, 83, 0.3);
        }
        .modal-icon-wrap.warning {
            background: rgba(255, 152, 0, 0.12);
            border: 2px solid rgba(255, 152, 0, 0.3);
        }
        .modal-icon-wrap.error {
            background: rgba(183, 28, 28, 0.12);
            border: 2px solid rgba(183, 28, 28, 0.3);
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--text-bright);
        }
        .modal-box p {
            color: var(--muted-light);
            font-size: 0.88rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.4rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .modal-close:hover {
            color: var(--text-bright);
            background: rgba(255, 255, 255, 0.06);
        }
        .modal-btn {
            padding: 0.8rem 2rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            letter-spacing: 0.04em;
            transition: all var(--transition);
            font-family: 'Space Grotesk', sans-serif;
            display: inline-block;
            text-decoration: none;
        }
        .modal-btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: var(--navy-deep);
            box-shadow: 0 6px 25px rgba(200, 150, 12, 0.3);
        }
        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(200, 150, 12, 0.5);
        }
        .modal-btn-secondary {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: var(--text-bright);
            margin-left: 0.8rem;
        }
        .modal-btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold-light);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--navy);
            border: 1px solid var(--border-gold);
            color: var(--text-bright);
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 500;
            z-index: 500;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 120px;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
            }
            body {
                padding-bottom: 80px;
            }
            .main-content {
                padding: 1.5rem 4%;
            }
            .page-title {
                font-size: 1.2rem;
            }
            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.2rem;
            }
            .detail-value {
                text-align: left;
            }
            .btn-row {
                flex-direction: column;
            }
            .btn-primary,
            .btn-danger,
            .btn-wa {
                text-align: center;
                justify-content: center;
            }
        }
        @media (max-width: 480px) {
            .top-nav {
                padding: 0 3%;
                height: 56px;
            }
            .nav-logo {
                font-size: 1.1rem;
            }
            .status-banner {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

    </script>

    <script>
        const WHATSAPP_GROUP_LINK = 'https://chat.whatsapp.com/JeeYoYCTGc18Au9rm299wz';
        let currentUser = null;
        let userData = null;
        let isEditing = false;

        // ── AUTH GUARD ──
        window.firebaseAuth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            document.getElementById('userAvatar').textContent = (user.displayName || user.email || 'U').charAt(0)
                .toUpperCase();
            await loadRegistration();
        });

        // ── LOAD REGISTRATION ──
        async function loadRegistration() {
            const skeleton = document.getElementById('loadingSkeleton');
            const container = document.getElementById('contentContainer');
            skeleton.style.display = 'block';
            container.style.display = 'none';

            try {
                const docSnap = await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDb, 'registrations',
                    currentUser.uid));
                if (!docSnap.exists()) {
                    container.innerHTML = `
                <div class="detail-card" style="text-align:center;padding:3rem 2rem;">
                  <div style="font-size:3rem;margin-bottom:1rem;">📭</div>
                  <h3 style="color:var(--text-bright);margin-bottom:0.5rem;">No Registration Found</h3>
                  <p style="color:var(--muted);margin-bottom:1.5rem;">You haven't registered for TechFest 2.0 yet.</p>
                  <a href="register.html" class="btn-primary" style="display:inline-block;">Register Now</a>
                </div>`;
                    skeleton.style.display = 'none';
                    container.style.display = 'block';
                    return;
                }
                userData = docSnap.data();
                userData.uid = docSnap.id;
                renderRegistration();
            } catch (error) {
                console.error('Error loading registration:', error);
                container.innerHTML = `
              <div class="detail-card" style="text-align:center;padding:3rem 2rem;">
                <div style="font-size:3rem;margin-bottom:1rem;">⚠️</div>
                <h3 style="color:var(--text-bright);margin-bottom:0.5rem;">Failed to Load</h3>
                <p style="color:var(--muted);margin-bottom:1.5rem;">Could not load your registration. Please try again.</p>
                <button class="btn-primary" onclick="loadRegistration()">Retry</button>
              </div>`;
            }
            skeleton.style.display = 'none';
            container.style.display = 'block';
        }

        // ── RENDER ──
        function renderRegistration() {
            const status = userData.status || 'pending';
            const statusConfig = {
                pending: { icon: '⏳', title: 'Registration Pending', subtitle: 'Your registration is under review. You\'ll be notified once confirmed.', color: 'pending' },
                confirmed: { icon: '✅', title: 'Registration Confirmed', subtitle: 'Your spot is secured! See you on 21-22 July 2025.', color: 'confirmed' },
                shortlisted: { icon: '⭐', title: 'Shortlisted', subtitle: 'You\'ve been shortlisted! Final selection will be communicated soon.', color: 'shortlisted' },
                selected: { icon: '🏆', title: 'Selected!', subtitle: 'Congratulations! You\'ve been selected. Prepare for an amazing experience.', color: 'selected' },
                cancelled: { icon: '❌', title: 'Registration Cancelled', subtitle: 'Your registration has been cancelled.', color: 'cancelled' }
            };
            const sc = statusConfig[status] || statusConfig.pending;

            const eventLabels = {
                hackathon: '⚙️ Hackathon',
                showcase: '💡 Talent Showcase',
                debate: '🎙️ Master Debate',
                prompting: '🤖 AI Prompting',
                spectator: '👥 Spectator'
            };
            const eventName = eventLabels[userData.eventType] || 'Unknown Event';
            const createdAt = userData.createdAt?.toDate?.() || new Date();
            const eventDetails = userData.eventDetails || {};

            let eventDetailsHtml = '';
            switch (userData.eventType) {
                case 'hackathon':
                    eventDetailsHtml = `
                <div class="detail-row"><span class="detail-label">Team Name</span><span class="detail-value">${eventDetails.teamName || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Member 2</span><span class="detail-value">${eventDetails.member2Name || '—'} (${eventDetails.member2Matric || '—'})</span></div>
                <div class="detail-row"><span class="detail-label">Member 3</span><span class="detail-value">${eventDetails.member3Name || '—'} (${eventDetails.member3Matric || '—'})</span></div>
                <div class="detail-row"><span class="detail-label">Member 4</span><span class="detail-value">${eventDetails.member4Name || '—'} (${eventDetails.member4Matric || '—'})</span></div>
                <div class="detail-row"><span class="detail-label">Member 5</span><span class="detail-value">${eventDetails.member5Name || '—'} (${eventDetails.member5Matric || '—'})</span></div>
                <div class="detail-row"><span class="detail-label">Project Idea</span><span class="detail-value">${eventDetails.projectIdea || 'Not provided'}</span></div>`;
                    break;
                case 'showcase':
                    eventDetailsHtml = `
                <div class="detail-row"><span class="detail-label">Project Name</span><span class="detail-value">${eventDetails.projectName || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Team Size</span><span class="detail-value">${eventDetails.teamSize || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Description</span><span class="detail-value">${eventDetails.projectDesc || 'Not provided'}</span></div>
                <div class="detail-row"><span class="detail-label">Tech Stack</span><span class="detail-value">${eventDetails.techStack || 'Not provided'}</span></div>`;
                    break;
                case 'debate':
                    const posMap = { for: 'For the Motion', against: 'Against the Motion', neutral: 'No Preference' };
                    eventDetailsHtml = `
                <div class="detail-row"><span class="detail-label">Position</span><span class="detail-value">${posMap[eventDetails.debatePosition] || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">Argument Summary</span><span class="detail-value">${eventDetails.argumentSummary || 'Not provided'}</span></div>
                <div class="detail-row"><span class="detail-label">Experience</span><span class="detail-value">${eventDetails.debateExperience || 'Not provided'}</span></div>`;
                    break;
                case 'prompting':
                    const catMap = { image: 'Image Generation', video: 'Video Generation', voice: 'Voice/Audio Loading' };
                    eventDetailsHtml = `
                <div class="detail-row"><span class="detail-label">Category</span><span class="detail-value">${catMap[eventDetails.promptCategory] || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">AI Experience</span><span class="detail-value">${eventDetails.aiExperience || 'Not provided'}</span></div>
                <div class="detail-row"><span class="detail-label">Screening Prompt</span><span class="detail-value">${eventDetails.screeningPrompt || 'Not provided'}</span></div>`;
                    break;
                case 'spectator':
                    eventDetailsHtml = `
                <div class="detail-row"><span class="detail-label">T-Shirt Size</span><span class="detail-value">${eventDetails.tshirtSize || 'Not selected'} ${!eventDetails.tshirtSize ? '⚠️' : ''}</span></div>`;
                    if (!eventDetails.tshirtSize) {
                        eventDetailsHtml +=
                            `<div style="margin-top:0.8rem;padding:0.6rem 1rem;background:rgba(183,28,28,0.08);border:1px solid rgba(183,28,28,0.3);border-radius:8px;font-size:0.75rem;color:#EF9A9A;">⚠️ Official T-Shirt (₦2,500) is mandatory for Day 2 entry. <a href="orders.html" style="color:var(--gold-light);">Order now →</a></div>`;
                    }
                    break;
            }

            // Calculate checklist progress
            const steps = [
                { label: 'Registration Complete', done: true },
                { label: 'Order Official T-Shirt', done: userData.eventType === 'spectator' ? !!eventDetails.tshirtSize : true },
                { label: 'Complete Payment', done: userData.paymentStatus === 'paid' },
                { label: 'Join WhatsApp Group', done: localStorage.getItem('wa_group_joined') === 'true' },
                { label: 'Attend on 21-22 July 2025', done: false }
            ];
            const completedSteps = steps.filter(s => s.done).length;
            const progressPercent = Math.round((completedSteps / steps.length) * 100);

            const container = document.getElementById('contentContainer');
            container.innerHTML = `
          <!-- Status Banner -->
          <div class="status-banner ${sc.color}">
            <div class="status-icon-wrap">${sc.icon}</div>
            <div class="status-info">
              <h3>${sc.title}</h3>
              <p>${sc.subtitle}</p>
            </div>
          </div>

          <!-- Personal Information -->
          <div class="detail-card">
            <div class="detail-card-header">
              <h3>👤 Personal Information</h3>
              <button class="edit-btn" id="editBtn" onclick="toggleEdit()">✏️ Edit</button>
            </div>
            <div id="viewMode">
              <div class="detail-row"><span class="detail-label">Full Name</span><span class="detail-value">${userData.fullName || 'N/A'}</span></div>
              <div class="detail-row"><span class="detail-label">Matric Number</span><span class="detail-value">${userData.matricNumber || 'N/A'}</span></div>
              <div class="detail-row"><span class="detail-label">Department</span><span class="detail-value">${userData.department || 'N/A'}</span></div>
              <div class="detail-row"><span class="detail-label">Level</span><span class="detail-value">${userData.level || 'N/A'} Level</span></div>
              <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${userData.email || 'N/A'}</span></div>
              <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${userData.phone || 'N/A'}</span></div>
            </div>
            <div id="editMode" style="display:none;">
              <div class="detail-row">
                <span class="detail-label">Full Name</span>
                <span class="detail-value">${userData.fullName || 'N/A'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Phone</span>
                <span class="detail-value editable" id="phoneDisplay" onclick="startEditPhone()">${userData.phone || 'Click to edit'}</span>
                <span class="inline-edit" id="phoneEdit">
                  <input type="tel" id="phoneInput" value="${userData.phone || ''}" placeholder="+234...">
                  <button class="inline-save" onclick="savePhone()">Save</button>
                  <button class="inline-cancel" onclick="cancelEditPhone()">Cancel</button>
                </span>
              </div>
              <div style="margin-top:1rem;display:flex;gap:0.6rem;">
                <button class="btn-primary" style="font-size:0.78rem;padding:0.6rem 1.5rem;" onclick="saveAllEdits()">💾 Save Changes</button>
                <button class="btn-danger" style="font-size:0.78rem;padding:0.6rem 1.5rem;" onclick="cancelAllEdits()">Cancel</button>
              </div>
            </div>
          </div>

          <!-- Event Details -->
          <div class="detail-card">
            <div class="detail-card-header">
              <h3>${eventName}</h3>
            </div>
            <div class="detail-row"><span class="detail-label">Registered</span><span class="detail-value">${createdAt.toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'})}</span></div>
            <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value" style="text-transform:capitalize;">${status}</span></div>
            ${eventDetailsHtml}
          </div>

          <!-- Checklist -->
          <div class="detail-card">
            <div class="detail-card-header">
              <h3>✅ Next Steps</h3>
            </div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" style="width:${progressPercent}%;"></div>
            </div>
            <p style="font-size:0.74rem;color:var(--muted);margin-bottom:0.8rem;">${completedSteps} of ${steps.length} steps complete</p>
            <ul class="checklist">
              ${steps.map(s => `
                <li class="${s.done ? 'done' : ''}">
                  <span class="check-icon">${s.done ? '✅' : '⬜'}</span> ${s.label}
                </li>
              `).join('')}
            </ul>
            ${!localStorage.getItem('wa_group_joined') ? `
              <a href="${WHATSAPP_GROUP_LINK}" target="_blank" class="btn-wa" style="margin-top:0.8rem;display:inline-flex;" onclick="localStorage.setItem('wa_group_joined','true');showToast('Joined WhatsApp group! ✅');setTimeout(()=>loadRegistration(),500);">
                📱 Join WhatsApp Group
              </a>` : ''}
          </div>

          <!-- Actions -->
          <div class="btn-row">
            <a href="orders.html" class="btn-primary">🛍️ Order Merchandise</a>
            ${status !== 'cancelled' ? `<button class="btn-danger" onclick="confirmCancel()">❌ Cancel Registration</button>` : ''}
            <a href="home.html" class="btn-primary" style="background:transparent;border:1.5px solid rgba(255,255,255,0.2);color:var(--text-bright);">← Back to Dashboard</a>
          </div>`;
        }

        // ── EDIT FUNCTIONS ──
        function toggleEdit() {
            isEditing = !isEditing;
            document.getElementById('viewMode').style.display = isEditing ? 'none' : 'block';
            document.getElementById('editMode').style.display = isEditing ? 'block' : 'none';
            document.getElementById('editBtn').textContent = isEditing ? '✏️ Editing...' : '✏️ Edit';
        }

        function startEditPhone() {
            document.getElementById('phoneDisplay').style.display = 'none';
            document.getElementById('phoneEdit').classList.add('active');
        }

        function cancelEditPhone() {
            document.getElementById('phoneDisplay').style.display = 'inline';
            document.getElementById('phoneEdit').classList.remove('active');
            document.getElementById('phoneInput').value = userData.phone || '';
        }

        async function savePhone() {
            const newPhone = document.getElementById('phoneInput').value.trim();
            if (!newPhone) {
                showToast('Please enter a valid phone number');
                return;
            }
            try {
                await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb, 'registrations', currentUser.uid), {
                    phone: newPhone
                });
                userData.phone = newPhone;
                document.getElementById('phoneDisplay').textContent = newPhone;
                cancelEditPhone();
                showToast('Phone number updated! ✅');
            } catch (error) {
                console.error('Error updating phone:', error);
                showToast('Failed to update. Please try again.');
            }
        }

        async function saveAllEdits() {
            await savePhone();
            toggleEdit();
            showToast('Changes saved successfully! ✅');
        }

        function cancelAllEdits() {
            document.getElementById('phoneInput').value = userData.phone || '';
            cancelEditPhone();
            toggleEdit();
        }

        // ── CANCEL REGISTRATION ──
        function confirmCancel() {
            document.getElementById('modalIconWrap').className = 'modal-icon-wrap warning';
            document.getElementById('modalIcon').textContent = '⚠️';
            document.getElementById('modalTitle').textContent = 'Cancel Registration?';
            document.getElementById('modalMessage').innerHTML =
                'Are you sure you want to cancel your registration?<br><br><strong>This cannot be undone.</strong> You will lose your spot in the event.';
            document.getElementById('modalButtons').innerHTML = `
            <button class="modal-btn modal-btn-primary" onclick="cancelRegistration()" style="background:var(--crimson);color:white;">Yes, Cancel My Registration</button>
            <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Keep My Registration</button>
          `;
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        async function cancelRegistration() {
            try {
                await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb, 'registrations', currentUser.uid), {
                    status: 'cancelled'
                });
                userData.status = 'cancelled';
                closeModal();
                document.getElementById('modalIconWrap').className = 'modal-icon-wrap success';
                document.getElementById('modalIcon').textContent = '✅';
                document.getElementById('modalTitle').textContent = 'Registration Cancelled';
                document.getElementById('modalMessage').textContent =
                    'Your registration has been cancelled. We\'re sorry to see you go.';
                document.getElementById('modalButtons').innerHTML =
                    '<button class="modal-btn modal-btn-primary" onclick="closeModal();loadRegistration();">OK</button>';
                document.getElementById('modalOverlay').classList.add('active');
            } catch (error) {
                console.error('Error cancelling registration:', error);
                showToast('Failed to cancel. Please try again.');
            }
        }

        // ── MODAL ──
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

        // ── TOAST ──
        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), duration);
        }
    </script>
</body>
</html>
