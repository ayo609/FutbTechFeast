<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registration — FUTB TechFest 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue:#060E1A;--navy:#0B1D3A;--navy-light:#142D5E;
            --teal:#0D9488;--teal-light:#14B8A6;--teal-pale:#CCFBF1;
            --sky:#38BDF8;--sky-light:#7DD3FC;--sky-pale:#E0F2FE;
            --white:#FFFFFF;--crimson:#EF4444;--green:#10B981;--orange:#F59E0B;
            --card:rgba(11,29,58,0.55);--glass:rgba(255,255,255,0.04);
            --border:rgba(56,189,248,0.2);--border-teal:rgba(20,184,166,0.4);
            --text:#E2E8F0;--text-bright:#F8FAFC;--muted:#94A3B8;--muted-light:#CBD5E1;
            --shadow-teal:0 0 30px rgba(20,184,166,0.15);
            --shadow-card:0 8px 40px rgba(0,0,0,0.3);
            --radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--teal) var(--deep-blue)}
        html::-webkit-scrollbar{width:6px}
        html::-webkit-scrollbar-track{background:var(--deep-blue)}
        html::-webkit-scrollbar-thumb{background:var(--teal);border-radius:3px}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--deep-blue);color:var(--text);
            min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:90px;position:relative;
        }
        body::before{
            content:'';position:fixed;inset:0;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events:none;z-index:0;opacity:0.3;
        }
        .top-nav{
            position:sticky;top:0;z-index:100;background:rgba(6,14,26,0.85);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border-bottom:1px solid var(--border);padding:0 5%;
            display:flex;align-items:center;justify-content:space-between;height:64px;
        }
        .nav-left{display:flex;align-items:center;gap:1rem}
        .back-btn{color:var(--muted);text-decoration:none;font-size:0.82rem;font-weight:500;letter-spacing:0.04em;transition:color var(--transition);display:flex;align-items:center;gap:0.3rem}
        .back-btn:hover{color:var(--teal-light)}
        .nav-logo{font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:0.08em;background:linear-gradient(135deg,var(--teal-light),var(--sky-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
        .user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;font-family:'JetBrains Mono',monospace;border:2px solid transparent;cursor:pointer;transition:all var(--transition);text-decoration:none}
        .user-avatar:hover{border-color:var(--teal-light);box-shadow:0 0 20px rgba(20,184,166,0.3)}
        .main-content{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:2rem 5%}
        .page-title{font-size:1.4rem;font-weight:700;color:var(--text-bright);margin-bottom:0.3rem}
        .page-subtitle{font-size:0.82rem;color:var(--muted);margin-bottom:2rem}
        .status-banner{border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1.2rem;border:1px solid}
        .status-banner.pending{background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.3)}
        .status-banner.confirmed{background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.3)}
        .status-banner.shortlisted{background:rgba(56,189,248,0.08);border-color:rgba(56,189,248,0.3)}

        .status-banner.cancelled{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.3)}
        .status-icon-wrap{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
        .pending .status-icon-wrap{background:rgba(245,158,11,0.15)}.confirmed .status-icon-wrap{background:rgba(16,185,129,0.15)}
        .shortlisted .status-icon-wrap{background:rgba(56,189,248,0.15)}.selected .status-icon-wrap{background:rgba(20,184,166,0.15)}.cancelled .status-icon-wrap{background:rgba(239,68,68,0.15)}
        .status-info h3{font-size:1.1rem;font-weight:700;color:var(--text-bright);margin-bottom:0.2rem}
        .status-info p{font-size:0.8rem;color:var(--muted-light);line-height:1.5}
        .detail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.2rem}

        .detail-card-header h3{font-size:0.9rem;font-weight:700;color:var(--text-bright);display:flex;align-items:center;gap:0.5rem}
        .edit-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.9rem;border-radius:100px;font-size:0.7rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;letter-spacing:0.05em;transition:all var(--transition)}

        .detail-row{display:flex;justify-content:space-between;align-items:center;padding:0.55rem 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:0.84rem}

        .detail-label{color:var(--muted);min-width:120px}
        .detail-value{color:var(--text-bright);font-weight:500;text-align:right}

        .inline-save,.inline-cancel{padding:0.35rem 0.7rem;border-radius:100px;font-size:0.7rem;cursor:pointer;border:none;font-family:'Space Grotesk',sans-serif;font-weight:600}
        .inline-save{background:var(--teal-light);color:var(--white)}
        .inline-cancel{background:transparent;border:1px solid var(--border);color:var(--muted)}

        .progress-bar-wrap{background:rgba(255,255,255,0.06);border-radius:100px;height:4px;margin:0.8rem 0 1.2rem;overflow:hidden}
        .progress-bar-fill{height:100%;background:var(--teal-light);border-radius:100px;transition:width 0.6s ease}
        .btn-row{display:flex;gap:0.8rem;flex-wrap:wrap;margin-top:1.5rem}
        .btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);padding:0.8rem 1.8rem;border-radius:100px;font-weight:700;font-size:0.85rem;border:none;cursor:pointer;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;text-decoration:none;display:inline-block;box-shadow:0 6px 25px rgba(20,184,166,0.25)}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(20,184,166,0.45)}
        .btn-danger{background:transparent;border:1.5px solid rgba(239,68,68,0.5);color:var(--crimson);padding:0.8rem 1.8rem;border-radius:100px;font-weight:600;font-size:0.85rem;cursor:pointer;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .btn-danger:hover{background:rgba(239,68,68,0.1);border-color:var(--crimson)}
        .btn-wa{background:#25D366;color:white;padding:0.8rem 1.8rem;border-radius:100px;font-weight:700;font-size:0.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;box-shadow:0 6px 25px rgba(37,211,102,0.25)}
        .btn-wa:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(37,211,102,0.45)}
        .skeleton{background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);animation:pulse 1.5s infinite}
        .skeleton-text{height:14px;margin:8px 0;width:80%}.skeleton-text.short{width:50%}
        @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.7}}
        .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(6,14,26,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:0.6rem 5%;justify-content:space-around;align-items:center}
        .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:0.25rem;text-decoration:none;color:var(--muted);font-size:1.3rem;transition:all var(--transition);padding:0.3rem 0.6rem;border-radius:var(--radius-sm)}
        .bottom-nav a.active{color:var(--teal-light);background:rgba(20,184,166,0.1)}
        .bottom-nav a span{font-size:0.6rem;letter-spacing:0.05em;font-weight:500}
        .modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition);padding:1rem}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-box{background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius-lg);padding:2.5rem 2rem;max-width:440px;width:100%;text-align:center;position:relative;box-shadow:0 30px 70px rgba(0,0,0,0.6);transform:translateY(20px);transition:transform 0.5s cubic-bezier(0.4,0,0.2,1)}
        .modal-overlay.active .modal-box{transform:translateY(0)}
        .modal-icon-wrap{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:2rem}
        .modal-icon-wrap.success{background:rgba(16,185,129,0.12);border:2px solid rgba(16,185,129,0.3)}
        .modal-icon-wrap.warning{background:rgba(245,158,11,0.12);border:2px solid rgba(245,158,11,0.3)}
        .modal-icon-wrap.error{background:rgba(239,68,68,0.12);border:2px solid rgba(239,68,68,0.3)}
        .modal-box h3{font-size:1.3rem;font-weight:700;margin-bottom:0.6rem;color:var(--text-bright)}
        .modal-box p{color:var(--muted-light);font-size:0.88rem;line-height:1.7;margin-bottom:1.5rem}
        .modal-close{position:absolute;top:1rem;right:1.2rem;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
        .modal-close:hover{color:var(--text-bright);background:rgba(255,255,255,0.06)}
        .modal-btn{padding:0.8rem 2rem;border-radius:100px;font-weight:700;font-size:0.9rem;cursor:pointer;border:none;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;display:inline-block;text-decoration:none}
        .modal-btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);box-shadow:0 6px 25px rgba(20,184,166,0.3)}
        .modal-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(20,184,166,0.5)}
        .modal-btn-secondary{background:transparent;border:1.5px solid rgba(148,163,184,0.25);color:var(--text-bright);margin-left:0.8rem}
        .modal-btn-secondary:hover{border-color:var(--teal-light);color:var(--teal-light)}
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid var(--border-teal);color:var(--text-bright);padding:0.8rem 1.5rem;border-radius:100px;font-size:0.82rem;font-weight:500;z-index:500;opacity:0;visibility:hidden;transition:all var(--transition);box-shadow:0 10px 30px rgba(0,0,0,0.5);white-space:nowrap}
        .toast.show{opacity:1;visibility:visible;bottom:120px}
        @media(max-width:768px){
            .bottom-nav{display:flex}body{padding-bottom:80px}.main-content{padding:1.5rem 4%}
            .page-title{font-size:1.2rem}.detail-row{flex-direction:column;align-items:flex-start;gap:0.2rem}
            .detail-value{text-align:left}.btn-row{flex-direction:column}
            .btn-primary,.btn-danger,.btn-wa{text-align:center;justify-content:center}
        }
        @media(max-width:480px){
            .top-nav{padding:0 3%;height:56px}.nav-logo{font-size:1.1rem}
            .status-banner{flex-direction:column;text-align:center}
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",
            authDomain: "futbtechfeast.firebaseapp.com",
            projectId: "futbtechfeast",
            storageBucket: "futbtechfeast.firebasestorage.app",
            messagingSenderId: "64095326173",
            appId: "1:64095326173:web:3f7cda8b0040ab2ea53034"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseOnAuthStateChanged = onAuthStateChanged;

    <script>
        const WHATSAPP_GROUP_LINK = 'https://whatsapp.com/channel/0029VbC7cwLAe5VzqHCUiQ1J';
        let currentUser = null, userData = null, isEditing = false, waGroupJoined = false;
        const loadingSkeleton=document.getElementById('loadingSkeleton'),contentContainer=document.getElementById('contentContainer');
        const userAvatar=document.getElementById('userAvatar'),modalOverlay=document.getElementById('modalOverlay');
        const modalIconWrap=document.getElementById('modalIconWrap'),modalIcon=document.getElementById('modalIcon');
        const modalTitle=document.getElementById('modalTitle'),modalMessage=document.getElementById('modalMessage');
        const modalButtons=document.getElementById('modalButtons'),toast=document.getElementById('toast');

        function waitForFirebase(cb){if(window.firebaseOnAuthStateChanged&&window.firebaseAuth){cb()}else{setTimeout(()=>waitForFirebase(cb),150)}}

        waitForFirebase(()=>{window.firebaseOnAuthStateChanged(window.firebaseAuth,async(user)=>{if(!user){window.location.href='login.html';return}currentUser=user;userAvatar.textContent=(user.displayName||user.email||'U').charAt(0).toUpperCase();await loadRegistration()})});

        async function loadRegistration(){loadingSkeleton.style.display='block';contentContainer.style.display='none';try{const docSnap=await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDb,'registrations',currentUser.uid));if(!docSnap.exists()){contentContainer.innerHTML='<div class="detail-card" style="text-align:center;padding:3rem 2rem;"><div style="font-size:3rem;margin-bottom:1rem;">📭</div><h3 style="color:var(--text-bright);">No Registration Found</h3><p style="color:var(--muted);margin-bottom:1.5rem;">You haven\'t registered yet.</p><a href="register.html" class="btn-primary" style="display:inline-block;">Register Now</a></div>';loadingSkeleton.style.display='none';contentContainer.style.display='block';return}userData=docSnap.data();userData.uid=docSnap.id;renderRegistration()}catch(e){contentContainer.innerHTML='<div class="detail-card" style="text-align:center;padding:3rem 2rem;"><div style="font-size:3rem;">⚠️</div><h3 style="color:var(--text-bright);">Failed to Load</h3><p style="color:var(--muted);">'+e.message+'</p><button class="btn-primary" id="retryBtn">Retry</button></div>'}loadingSkeleton.style.display='none';contentContainer.style.display='block';bindDynamicEvents()}

        function renderRegistration(){
            const status=userData.status||'pending';
            const sc={pending:{icon:'⏳',title:'Registration Pending',subtitle:'Your registration is under review.',color:'pending'},confirmed:{icon:'✅',title:'Registration Confirmed',subtitle:'See you on 21-23 July 2025!',color:'confirmed'},shortlisted:{icon:'⭐',title:'Shortlisted',subtitle:'You\'ve been shortlisted!',color:'shortlisted'},selected:{icon:'🏆',title:'Selected!',subtitle:'Congratulations!',color:'selected'},cancelled:{icon:'❌',title:'Cancelled',subtitle:'Registration cancelled.',color:'cancelled'}}[status]||{icon:'⏳',title:'Pending',subtitle:'',color:'pending'};
            const EL={hackathon:'⚙️ Hackathon',showcase:'💡 Talent Showcase',debate:'🎙️ Master Debate',prompting:'🤖 AI Prompting',spectator:'👥 Spectator'};
            const eventName=EL[userData.eventType]||'Unknown',createdAt=userData.createdAt?.toDate?.()||new Date(),ed=userData.eventDetails||{};
            let edHtml='';
            switch(userData.eventType){case'hackathon':edHtml='<div class="detail-row"><span class="detail-label">Team Name</span><span class="detail-value">'+(ed.teamName||'N/A')+'</span></div>';for(let i=2;i<=5;i++)edHtml+='<div class="detail-row"><span class="detail-label">Member '+i+'</span><span class="detail-value">'+(ed['member'+i+'Name']||'—')+' ('+(ed['member'+i+'Matric']||'—')+')</span></div>';edHtml+='<div class="detail-row"><span class="detail-label">Project Idea</span><span class="detail-value">'+(ed.projectIdea||'Not provided')+'</span></div>';break;case'showcase':edHtml='<div class="detail-row"><span class="detail-label">Project Name</span><span class="detail-value">'+(ed.projectName||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Team Size</span><span class="detail-value">'+(ed.teamSize||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Description</span><span class="detail-value">'+(ed.projectDesc||'Not provided')+'</span></div><div class="detail-row"><span class="detail-label">Tech Stack</span><span class="detail-value">'+(ed.techStack||'Not provided')+'</span></div>';break;case'debate':const pm={for:'For the Motion',against:'Against the Motion',neutral:'No Preference'};edHtml='<div class="detail-row"><span class="detail-label">Position</span><span class="detail-value">'+(pm[ed.debatePosition]||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Argument</span><span class="detail-value">'+(ed.argumentSummary||'Not provided')+'</span></div><div class="detail-row"><span class="detail-label">Experience</span><span class="detail-value">'+(ed.debateExperience||'Not provided')+'</span></div>';break;case'prompting':const cm={image:'Image Generation',video:'Video Generation',voice:'Voice/Audio'};edHtml='<div class="detail-row"><span class="detail-label">Category</span><span class="detail-value">'+(cm[ed.promptCategory]||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">AI Experience</span><span class="detail-value">'+(ed.aiExperience||'Not provided')+'</span></div><div class="detail-row"><span class="detail-label">Prompt</span><span class="detail-value">'+(ed.screeningPrompt||'Not provided')+'</span></div>';break;case'spectator':edHtml='<div class="detail-row"><span class="detail-label">T-Shirt Size</span><span class="detail-value">'+(ed.tshirtSize||'Not selected')+(ed.tshirtSize?'':' ⚠️')+'</span></div>';if(!ed.tshirtSize)edHtml+='<div style="margin-top:0.8rem;padding:0.6rem 1rem;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:8px;font-size:0.75rem;color:#FCA5A5;">⚠️ T-Shirt (₦7,000) mandatory for Day 2. <a href="orders.html" style="color:var(--teal-light);">Order now →</a></div>';break}
            const steps=[{label:'Registration Complete',done:true},{label:'Order Official T-Shirt',done:userData.eventType==='spectator'?!!ed.tshirtSize:true},{label:'Complete Payment',done:userData.paymentStatus==='paid'},{label:'Join WhatsApp Group',done:waGroupJoined},{label:'Attend on 21-23 July 2025',done:false}];
            const completed=steps.filter(s=>s.done).length,pct=Math.round((completed/steps.length)*100);
            contentContainer.innerHTML='<div class="status-banner '+sc.color+'"><div class="status-icon-wrap">'+sc.icon+'</div><div class="status-info"><h3>'+sc.title+'</h3><p>'+sc.subtitle+'</p></div></div><div class="detail-card"><div class="detail-card-header"><h3>👤 Personal Info</h3><button class="edit-btn" id="editBtn">✏️ Edit</button></div><div id="viewMode"><div class="detail-row"><span class="detail-label">Full Name</span><span class="detail-value">'+(userData.fullName||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Matric</span><span class="detail-value">'+(userData.matricNumber||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Department</span><span class="detail-value">'+(userData.department||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Level</span><span class="detail-value">'+(userData.level||'N/A')+' Level</span></div><div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">'+(userData.email||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">'+(userData.phone||'N/A')+'</span></div></div><div id="editMode" style="display:none;"><div class="detail-row"><span class="detail-label">Full Name</span><span class="detail-value">'+(userData.fullName||'N/A')+'</span></div><div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value editable" id="phoneDisplay">'+(userData.phone||'Click to edit')+'</span><span class="inline-edit" id="phoneEdit"><input type="tel" id="phoneInput" value="'+(userData.phone||'')+'" placeholder="+234..."><button class="inline-save" id="savePhoneBtn">Save</button><button class="inline-cancel" id="cancelPhoneBtn">Cancel</button></span></div><div style="margin-top:1rem;display:flex;gap:0.6rem;"><button class="btn-primary" id="saveAllBtn" style="font-size:0.78rem;padding:0.6rem 1.5rem;">💾 Save</button><button class="btn-danger" id="cancelAllBtn" style="font-size:0.78rem;padding:0.6rem 1.5rem;">Cancel</button></div></div></div><div class="detail-card"><div class="detail-card-header"><h3>'+eventName+'</h3></div><div class="detail-row"><span class="detail-label">Registered</span><span class="detail-value">'+createdAt.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</span></div><div class="detail-row"><span class="detail-label">Status</span><span class="detail-value" style="text-transform:capitalize;">'+status+'</span></div>'+edHtml+'</div><div class="detail-card"><div class="detail-card-header"><h3>✅ Next Steps</h3></div><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+pct+'%;"></div></div><p style="font-size:0.74rem;color:var(--muted);margin-bottom:0.8rem;">'+completed+' of '+steps.length+' complete</p><ul class="checklist">'+steps.map(s=>'<li class="'+(s.done?'done':'')+'"><span class="check-icon">'+(s.done?'✅':'⬜')+'</span> '+s.label+'</li>').join('')+'</ul>'+(waGroupJoined?'':'<a href="'+WHATSAPP_GROUP_LINK+'" target="_blank" class="btn-wa" id="waJoinBtn" style="margin-top:0.8rem;display:inline-flex;">📱 Join WhatsApp</a>')+'</div><div class="btn-row"><a href="orders.html" class="btn-primary">🛍️ Order Merch</a>'+(status!=='cancelled'?'<button class="btn-danger" id="cancelRegBtn">❌ Cancel Registration</button>':'')+'<a href="home.html" class="btn-primary" style="background:transparent;border:1.5px solid rgba(148,163,184,0.3);color:var(--text-bright);">← Dashboard</a></div>';
        }

        function bindDynamicEvents(){const retryBtn=document.getElementById('retryBtn');if(retryBtn)retryBtn.addEventListener('click',loadRegistration);const editBtn=document.getElementById('editBtn');if(editBtn)editBtn.addEventListener('click',toggleEdit);const phoneDisplay=document.getElementById('phoneDisplay');if(phoneDisplay)phoneDisplay.addEventListener('click',startEditPhone);const savePhoneBtn=document.getElementById('savePhoneBtn');if(savePhoneBtn)savePhoneBtn.addEventListener('click',savePhone);const cancelPhoneBtn=document.getElementById('cancelPhoneBtn');if(cancelPhoneBtn)cancelPhoneBtn.addEventListener('click',cancelEditPhone);const saveAllBtn=document.getElementById('saveAllBtn');if(saveAllBtn)saveAllBtn.addEventListener('click',saveAllEdits);const cancelAllBtn=document.getElementById('cancelAllBtn');if(cancelAllBtn)cancelAllBtn.addEventListener('click',cancelAllEdits);const cancelRegBtn=document.getElementById('cancelRegBtn');if(cancelRegBtn)cancelRegBtn.addEventListener('click',confirmCancel);const waJoinBtn=document.getElementById('waJoinBtn');if(waJoinBtn)waJoinBtn.addEventListener('click',()=>{waGroupJoined=true;showToast('Joined! ✅');setTimeout(()=>{renderRegistration();bindDynamicEvents()},500)})}
        function toggleEdit(){isEditing=!isEditing;document.getElementById('viewMode').style.display=isEditing?'none':'block';document.getElementById('editMode').style.display=isEditing?'block':'none';const eb=document.getElementById('editBtn');if(eb)eb.textContent=isEditing?'✏️ Editing...':'✏️ Edit'}
        function startEditPhone(){document.getElementById('phoneDisplay').style.display='none';document.getElementById('phoneEdit').classList.add('active')}
        function cancelEditPhone(){document.getElementById('phoneDisplay').style.display='inline';document.getElementById('phoneEdit').classList.remove('active');document.getElementById('phoneInput').value=userData.phone||''}
        async function savePhone(){const np=document.getElementById('phoneInput').value.trim();if(!np){showToast('Enter valid phone');return}try{await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb,'registrations',currentUser.uid),{phone:np});userData.phone=np;document.getElementById('phoneDisplay').textContent=np;cancelEditPhone();showToast('Updated! ✅')}catch(e){showToast('Failed')}}
        async function saveAllEdits(){await savePhone();toggleEdit();showToast('Saved! ✅')}
        function cancelAllEdits(){document.getElementById('phoneInput').value=userData.phone||'';cancelEditPhone();toggleEdit()}
        function confirmCancel(){modalIconWrap.className='modal-icon-wrap warning';modalIcon.textContent='⚠️';modalTitle.textContent='Cancel?';modalMessage.innerHTML='This cannot be undone.';modalButtons.innerHTML='<button class="modal-btn modal-btn-primary" id="confirmCancelBtn" style="background:var(--crimson);color:white;">Yes, Cancel</button><button class="modal-btn modal-btn-secondary" id="keepRegBtn">Keep</button>';modalOverlay.classList.add('active');document.body.style.overflow='hidden';document.getElementById('confirmCancelBtn').addEventListener('click',cancelRegistration);document.getElementById('keepRegBtn').addEventListener('click',closeModal)}
        async function cancelRegistration(){try{await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb,'registrations',currentUser.uid),{status:'cancelled'});userData.status='cancelled';closeModal();modalIconWrap.className='modal-icon-wrap success';modalIcon.textContent='✅';modalTitle.textContent='Cancelled';modalMessage.textContent='Registration cancelled.';modalButtons.innerHTML='<button class="modal-btn modal-btn-primary" id="okAfterCancel">OK</button>';modalOverlay.classList.add('active');document.getElementById('okAfterCancel').addEventListener('click',()=>{closeModal();loadRegistration()})}catch(e){showToast('Failed')}}
        function closeModal(){modalOverlay.classList.remove('active');document.body.style.overflow=''}
        document.getElementById('modalCloseBtn').addEventListener('click',closeModal);
        modalOverlay.addEventListener('click',function(e){if(e.target===this)closeModal()});
        document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
        function showToast(m,d=3000){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),d)}
    </script>
</body>
</html>
