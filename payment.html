<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment — FUTB TechFest 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:#0D2B4E;--navy-deep:#06182B;--gold:#C8960C;--gold-light:#F0B429;--gold-pale:#FCEABB;
            --blue:#1565C0;--crimson:#B71C1C;--green:#00C853;--orange:#FF9800;--dark:#080F1A;--darker:#040810;
            --card:rgba(13,43,78,0.55);--glass:rgba(255,255,255,0.04);--border:rgba(200,150,12,0.2);
            --border-gold:rgba(200,150,12,0.4);--text:#E8F0FF;--text-bright:#FFFFFF;
            --muted:#8899BB;--muted-light:#A0B0CC;--shadow-gold:0 0 30px rgba(200,150,12,0.15);
            --shadow-card:0 8px 40px rgba(0,0,0,0.3);--radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--gold) var(--darker)}
        html::-webkit-scrollbar{width:6px}
        html::-webkit-scrollbar-track{background:var(--darker)}
        html::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--darker);color:var(--text);
            min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:90px;position:relative;
        }
        body::before{
            content:'';position:fixed;inset:0;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events:none;z-index:0;opacity:0.35;
        }
        .top-nav{
            position:sticky;top:0;z-index:100;background:rgba(4,8,16,0.85);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border-bottom:1px solid var(--border);padding:0 5%;
            display:flex;align-items:center;justify-content:space-between;height:64px;
        }
        .nav-left{display:flex;align-items:center;gap:1rem}
        .back-btn{color:var(--muted);text-decoration:none;font-size:0.82rem;font-weight:500;letter-spacing:0.04em;transition:color var(--transition);display:flex;align-items:center;gap:0.3rem}
        .back-btn:hover{color:var(--gold-light)}
        .nav-logo{font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:0.08em;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
        .user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;font-family:'JetBrains Mono',monospace;border:2px solid transparent;cursor:pointer;transition:all var(--transition);text-decoration:none}
        .user-avatar:hover{border-color:var(--gold-light);box-shadow:0 0 20px rgba(200,150,12,0.3)}
        .main-content{position:relative;z-index:1;max-width:650px;margin:0 auto;padding:2rem 5%}
        .page-title{font-size:1.4rem;font-weight:700;color:var(--text-bright);margin-bottom:0.3rem;display:flex;align-items:center;gap:0.5rem}
        .page-subtitle{font-size:0.82rem;color:var(--muted);margin-bottom:1.5rem}
        .detail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.2rem}
        .detail-card-header{display:flex;align-items:center;gap:0.6rem;margin-bottom:1rem;padding-bottom:0.8rem;border-bottom:1px solid var(--border)}
        .detail-card-header h3{font-size:0.95rem;font-weight:700;color:var(--text-bright)}
        .detail-row{display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;font-size:0.84rem;border-bottom:1px solid rgba(255,255,255,0.03)}
        .detail-row:last-child{border-bottom:none}
        .detail-label{color:var(--muted);min-width:100px}
        .detail-value{color:var(--text-bright);font-weight:500;text-align:right}
        .total-row{font-size:1.1rem;font-weight:700;color:var(--gold-light);padding-top:0.8rem;margin-top:0.4rem;border-top:1px solid var(--border-gold)}
        .total-row .detail-value{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--gold-light);letter-spacing:0.03em}
        .custom-name-tag{display:inline-block;background:rgba(200,150,12,0.1);border:1px dashed rgba(200,150,12,0.3);padding:0.15rem 0.5rem;border-radius:4px;font-size:0.72rem;color:var(--gold-light);font-style:italic}
        .tracking-id-tag{display:inline-block;background:rgba(200,150,12,0.08);border:1px solid var(--border-gold);padding:0.2rem 0.6rem;border-radius:4px;font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--gold-light);letter-spacing:0.05em}
        .status-badge{display:inline-block;padding:0.3rem 0.9rem;border-radius:100px;font-size:0.68rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
        .status-pending{background:rgba(255,152,0,0.12);border:1px solid rgba(255,152,0,0.3);color:#FFB74D}
        .status-proof{background:rgba(21,101,192,0.12);border:1px solid rgba(21,101,192,0.3);color:#64B5F6}
        .status-confirmed{background:rgba(0,200,83,0.12);border:1px solid rgba(0,200,83,0.3);color:#69F0AE}
        .status-delivered{background:rgba(200,150,12,0.12);border:1px solid rgba(200,150,12,0.3);color:#FFD54F}
        .status-cancelled{background:rgba(183,28,28,0.1);border:1px solid rgba(183,28,28,0.3);color:#EF9A9A}
        .bank-box{background:rgba(200,150,12,0.05);border:1px solid var(--border-gold);border-radius:var(--radius-sm);padding:1.2rem}
        .bank-box .bank-row{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0;font-size:0.84rem;border-bottom:1px solid rgba(255,255,255,0.04);flex-wrap:wrap;gap:0.5rem}
        .bank-row:last-child{border-bottom:none}
        .bank-label{color:var(--muted);font-weight:500}
        .bank-value{color:var(--text-bright);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:0.82rem;letter-spacing:0.03em}
        .copy-btn{background:rgba(200,150,12,0.15);border:1px solid rgba(200,150,12,0.3);color:var(--gold-light);padding:0.3rem 0.7rem;border-radius:100px;font-size:0.68rem;cursor:pointer;font-weight:600;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;white-space:nowrap}
        .copy-btn:hover{background:rgba(200,150,12,0.25)}
        .ref-example{font-size:0.72rem;color:var(--muted);margin-top:0.5rem;font-style:italic}
        .warning-note{font-size:0.7rem;color:#FFB74D;margin-top:0.6rem;display:flex;align-items:center;gap:0.3rem}
        .upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:2rem;text-align:center;cursor:pointer;transition:all var(--transition);position:relative}
        .upload-area:hover{border-color:var(--border-gold);background:rgba(200,150,12,0.03)}
        .upload-area.drag-over{border-color:var(--gold-light);background:rgba(200,150,12,0.08)}
        .upload-icon{font-size:2.5rem;margin-bottom:0.5rem}
        .upload-area p{font-size:0.82rem;color:var(--muted-light)}
        .upload-area .upload-hint{font-size:0.7rem;color:var(--muted);margin-top:0.3rem}
        .upload-area input[type="file"]{display:none}
        .preview-container{display:none;margin-top:1rem;text-align:center}
        .preview-container.active{display:block}
        .preview-img{max-width:100%;max-height:250px;border-radius:var(--radius-sm);border:1px solid var(--border)}
        .preview-actions{display:flex;gap:0.6rem;justify-content:center;margin-top:0.8rem}
        .file-info{font-size:0.72rem;color:var(--muted);margin-top:0.3rem}
        .tracker{display:flex;align-items:center;justify-content:space-between;position:relative;padding:0 1rem;margin:1rem 0}
        .tracker-step{display:flex;flex-direction:column;align-items:center;gap:0.5rem;position:relative;z-index:2;text-align:center;flex:1}
        .tracker-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;background:var(--glass);border:2px solid var(--border);transition:all var(--transition)}
        .tracker-dot.done{background:var(--green);border-color:var(--green);color:white}
        .tracker-dot.active{background:rgba(21,101,192,0.2);border-color:var(--blue);color:var(--text-bright);animation:pulse-dot 1.5s infinite}
        @keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(21,101,192,0.4)}50%{box-shadow:0 0 0 12px rgba(21,101,192,0)}}
        .tracker-label{font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
        .tracker-label.done{color:var(--green)}.tracker-label.active{color:#64B5F6}
        .tracker-line{position:absolute;top:20px;left:15%;right:15%;height:2px;background:var(--border);z-index:1}
        .tracker-line-fill{height:100%;background:var(--green);transition:width 0.6s ease;border-radius:2px}
        .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-deep);padding:0.8rem 1.8rem;border-radius:100px;font-weight:700;font-size:0.85rem;border:none;cursor:pointer;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;text-decoration:none;display:inline-block;box-shadow:0 6px 25px rgba(200,150,12,0.25);width:100%;text-align:center}
        .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 35px rgba(200,150,12,0.45)}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed}
        .btn-wa{background:#25D366;color:white;padding:0.8rem 1.8rem;border-radius:100px;font-weight:700;font-size:0.85rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;width:100%;text-align:center;box-shadow:0 6px 25px rgba(37,211,102,0.25)}
        .btn-wa:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(37,211,102,0.45)}
        .btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,0.2);color:var(--text-bright);padding:0.8rem 1.8rem;border-radius:100px;font-weight:600;font-size:0.85rem;cursor:pointer;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;text-decoration:none;display:inline-block;width:100%;text-align:center}
        .btn-outline:hover{border-color:var(--gold);color:var(--gold-light)}
        .btn-spinner{display:none;width:18px;height:18px;border:2.5px solid transparent;border-top-color:var(--navy-deep);border-radius:50%;animation:spin 0.7s linear infinite;margin-right:0.5rem;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}
        .notes-card{background:rgba(255,152,0,0.06);border:1px solid rgba(255,152,0,0.25);border-radius:var(--radius);padding:1rem 1.2rem;font-size:0.76rem;color:#FFB74D;line-height:1.6}
        .notes-card strong{color:#FFD54F}
        .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(4,8,16,0.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:0.6rem 5%;justify-content:space-around;align-items:center}
        .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:0.25rem;text-decoration:none;color:var(--muted);font-size:1.3rem;transition:all var(--transition);padding:0.3rem 0.6rem;border-radius:var(--radius-sm)}
        .bottom-nav a.active{color:var(--gold-light);background:rgba(200,150,12,0.1)}
        .bottom-nav a span{font-size:0.6rem;letter-spacing:0.05em;font-weight:500}
        .modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition);padding:1rem}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-box{background:var(--navy);border:1px solid var(--border-gold);border-radius:var(--radius-lg);padding:2rem 1.8rem;max-width:440px;width:100%;text-align:center;position:relative;box-shadow:0 30px 70px rgba(0,0,0,0.6);transform:translateY(20px);transition:transform 0.5s cubic-bezier(0.4,0,0.2,1)}
        .modal-overlay.active .modal-box{transform:translateY(0)}
        .modal-icon-wrap{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.8rem}
        .modal-icon-wrap.success{background:rgba(0,200,83,0.12);border:2px solid rgba(0,200,83,0.3)}
        .modal-icon-wrap.error{background:rgba(183,28,28,0.12);border:2px solid rgba(183,28,28,0.3)}
        .modal-box h3{font-size:1.2rem;font-weight:700;margin-bottom:0.4rem;color:var(--text-bright)}
        .modal-box p{color:var(--muted-light);font-size:0.85rem;line-height:1.6;margin-bottom:1.2rem}
        .modal-close{position:absolute;top:1rem;right:1.2rem;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
        .modal-close:hover{color:var(--text-bright);background:rgba(255,255,255,0.06)}
        .modal-btn{padding:0.7rem 1.5rem;border-radius:100px;font-weight:700;font-size:0.85rem;cursor:pointer;border:none;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif;display:inline-block;text-decoration:none}
        .modal-btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-deep);box-shadow:0 6px 25px rgba(200,150,12,0.3)}
        .modal-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(200,150,12,0.5)}
        .modal-btn-secondary{background:transparent;border:1.5px solid rgba(255,255,255,0.25);color:var(--text-bright);margin-left:0.5rem}
        .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid var(--border-gold);color:var(--text-bright);padding:0.8rem 1.5rem;border-radius:100px;font-size:0.82rem;font-weight:500;z-index:500;opacity:0;visibility:hidden;transition:all var(--transition);box-shadow:0 10px 30px rgba(0,0,0,0.5);white-space:nowrap}
        .toast.show{opacity:1;visibility:visible;bottom:120px}
        .skeleton{background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);animation:pulse 1.5s infinite}
        .skeleton-text{height:14px;margin:8px 0;width:80%;border-radius:4px}.skeleton-text.short{width:50%}
        @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.7}}
        @media(max-width:768px){
            .bottom-nav{display:flex}body{padding-bottom:80px}.main-content{padding:1.5rem 4%}
            .page-title{font-size:1.2rem}.bank-box .bank-row{flex-direction:column;align-items:flex-start;gap:0.3rem}
            .tracker-label{font-size:0.55rem}
        }
        @media(max-width:480px){
            .top-nav{padding:0 3%;height:56px}.nav-logo{font-size:1.1rem}
            .detail-row{flex-direction:column;align-items:flex-start;gap:0.2rem}.detail-value{text-align:left}
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",
            authDomain: "futbtechfeast.firebaseapp.com",
            projectId: "futbtechfeast",
            storageBucket: "futbtechfeast.firebasestorage.app",
            messagingSenderId: "64095326173",
            appId: "1:64095326173:web:3f7cda8b0040ab2ea53034"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ✅ EXPOSE TO GLOBAL SCOPE
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseOnAuthStateChanged = onAuthStateChanged;
        window.firebaseGetDoc = getDoc;

    <script>
        const PAYMENT_CONFIG = {
            bankName: 'PALMPAY',
            accountName: 'Taufeek Muftau',
            accountNumber: '9167378733',
            whatsappNumber: '234XXXXXXXXXX',
            whatsappMessage: (trackingId, name, amount) =>
                `Hello, I've made payment for TechFest 2.0.%0A%0ATracking ID: ${trackingId}%0AName: ${name}%0AAmount: ₦${amount.toLocaleString()}%0A%0AProof of payment has been uploaded to my account.`
        };

        let currentUser = null;
        let orderData = null;
        let orderId = null;
        let proofBase64 = null;
        let proofFileName = null;

        const loadingSkeleton = document.getElementById('loadingSkeleton');
        const contentContainer = document.getElementById('contentContainer');
        const userAvatar = document.getElementById('userAvatar');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalIconWrap = document.getElementById('modalIconWrap');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalButtons = document.getElementById('modalButtons');
        const toast = document.getElementById('toast');

        // ═══════════ WAIT FOR FIREBASE ═══════════
        function waitForFirebase(callback) {
            if (window.firebaseOnAuthStateChanged && window.firebaseAuth) { callback(); } 
            else { setTimeout(() => waitForFirebase(callback), 150); }
        }

        waitForFirebase(() => {
            window.firebaseOnAuthStateChanged(window.firebaseAuth, async (user) => {
                if (!user) { window.location.href = 'login.html'; return; }
                currentUser = user;
                userAvatar.textContent = (user.displayName || user.email || 'U').charAt(0).toUpperCase();
                await initPage();
            });
        });

        async function initPage() {
            const params = new URLSearchParams(window.location.search);
            orderId = params.get('orderId');
            if (!orderId) { showNoOrderId(); return; }
            await loadOrder();
            setupRealTimeListener();
        }

        function showNoOrderId() {
            loadingSkeleton.style.display = 'none';
            contentContainer.style.display = 'block';
            contentContainer.innerHTML = `<div class="detail-card" style="text-align:center;padding:3rem 2rem;"><div style="font-size:3rem;margin-bottom:1rem;">📭</div><h3 style="color:var(--text-bright);margin-bottom:0.5rem;">No Order Specified</h3><p style="color:var(--muted);margin-bottom:1.5rem;">Please go to your orders page to select an order for payment.</p><a href="orders.html" class="btn-primary" style="display:inline-block;width:auto;padding:0.8rem 2rem;">Go to My Orders</a></div>`;
        }

        async function loadOrder() {
            try {
                const docSnap = await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDb, 'merchandise_orders', orderId));
                if (!docSnap.exists()) {
                    loadingSkeleton.style.display = 'none';
                    contentContainer.style.display = 'block';
                    contentContainer.innerHTML = `<div class="detail-card" style="text-align:center;padding:3rem 2rem;"><div style="font-size:3rem;margin-bottom:1rem;">🔍</div><h3 style="color:var(--text-bright);margin-bottom:0.5rem;">Order Not Found</h3><p style="color:var(--muted);margin-bottom:1.5rem;">This order doesn't exist.</p><a href="orders.html" class="btn-primary" style="display:inline-block;width:auto;padding:0.8rem 2rem;">Go to My Orders</a></div>`;
                    return;
                }
                orderData = docSnap.data();
                orderData.docId = docSnap.id;
                console.log('✅ Order loaded:', orderData.itemName, '| Tracking:', orderData.trackingId, '| Total: ₦' + orderData.totalPrice);
                renderPage();
            } catch (error) { console.error('Error:', error);
                showToast('Failed to load order. Please refresh.'); }
        }

        function setupRealTimeListener() {
            window.firebaseOnSnapshot(window.firebaseDoc(window.firebaseDb, 'merchandise_orders', orderId), (docSnap) => {
                if (docSnap.exists()) { orderData = docSnap.data();
                    orderData.docId = docSnap.id;
                    renderPage(); }
            });
        }

        function renderPage() {
            loadingSkeleton.style.display = 'none';
            contentContainer.style.display = 'block';
            const status = orderData.status || 'pending_payment';
            const iconMap = { tshirt: '👕', cap: '🧢', bundle: '🎽' };
            const icon = iconMap[orderData.itemType] || '📦';
            const trackingId = orderData.trackingId || orderData.orderId || 'TECH-XXXX';
            const sc = { pending_payment: { class: 'status-pending', label: 'Pending Payment' }, proof_sent: { class: 'status-proof', label: 'Awaiting Verification' }, confirmed: { class: 'status-confirmed', label: 'Payment Approved ✅' }, delivered: { class: 'status-delivered', label: 'Delivered 🎁' }, cancelled: { class: 'status-cancelled', label: 'Cancelled' } } [status] || { class: 'status-pending', label: 'Pending Payment' };
            const step1Done = status !== 'pending_payment';
            const step2Active = status === 'proof_sent';
            const step2Done = status === 'confirmed' || status === 'delivered';
            const step3Done = status === 'confirmed' || status === 'delivered';
            const trackerFillWidth = step3Done ? '100%' : step2Done ? '50%' : step1Done ? '25%' : '0%';

            contentContainer.innerHTML = `
            <div class="detail-card">
                <div class="detail-card-header"><h3>📋 Order Summary</h3><span class="status-badge ${sc.class}">${sc.label}</span></div>
                <div class="detail-row"><span class="detail-label">Tracking ID</span><span class="detail-value"><span class="tracking-id-tag">📦 ${trackingId}</span></span></div>
                <div class="detail-row"><span class="detail-label">Item</span><span class="detail-value">${icon} ${orderData.itemName}</span></div>
                ${orderData.size?`<div class="detail-row"><span class="detail-label">Size</span><span class="detail-value">${orderData.size}</span></div>`:''}
                ${orderData.customName?`<div class="detail-row"><span class="detail-label">Name on Back</span><span class="detail-value"><span class="custom-name-tag">🎨 ${orderData.customName}</span></span></div>`:''}
                <div class="detail-row"><span class="detail-label">Quantity</span><span class="detail-value">${orderData.quantity}</span></div>
                <div class="detail-row"><span class="detail-label">Unit Price</span><span class="detail-value">₦${orderData.unitPrice?.toLocaleString()}</span></div>
                <div class="detail-row total-row"><span class="detail-label">Total to Pay</span><span class="detail-value">₦${orderData.totalPrice?.toLocaleString()}</span></div>
            </div>
            ${status==='cancelled'?`<div class="detail-card" style="text-align:center;padding:2rem;"><div style="font-size:3rem;margin-bottom:1rem;">❌</div><h3 style="color:var(--text-bright);">Order Cancelled</h3><p style="color:var(--muted);margin:1rem 0;">This order has been cancelled.</p><a href="orders.html" class="btn-outline" style="display:inline-block;width:auto;padding:0.7rem 2rem;">Back to Orders</a></div>`:''}
            ${status==='confirmed'||status==='delivered'?`<div class="detail-card" style="text-align:center;padding:2rem;border-color:rgba(0,200,83,0.4);"><div style="font-size:3rem;margin-bottom:1rem;">✅</div><h3 style="color:#69F0AE;">Payment Approved!</h3><p style="color:var(--muted-light);margin:0.8rem 0;">${status==='delivered'?'Your items are ready for collection!':'Your items will be ready at Day 1 Registration Desk.'}</p><a href="orders.html" class="btn-outline" style="display:inline-block;width:auto;padding:0.7rem 2rem;">Back to Orders</a></div>`:''}
            ${status!=='cancelled'&&status!=='confirmed'&&status!=='delivered'?`
            <div class="detail-card">
                <div class="detail-card-header"><h3>🏦 Bank Transfer Details</h3></div>
                <div class="bank-box">
                    <div class="bank-row"><span class="bank-label">Bank</span><span class="bank-value">${PAYMENT_CONFIG.bankName}</span></div>
                    <div class="bank-row"><span class="bank-label">Account Name</span><span class="bank-value">${PAYMENT_CONFIG.accountName}</span></div>
                    <div class="bank-row"><span class="bank-label">Account Number</span><span class="bank-value">${PAYMENT_CONFIG.accountNumber}</span><button class="copy-btn" id="copyAccountBtn">📋 Copy</button></div>
                    <div class="bank-row"><span class="bank-label">Amount</span><span class="bank-value" style="color:var(--gold-light);">₦${orderData.totalPrice?.toLocaleString()}</span></div>
                    <div class="ref-example">📌 Reference: <strong>Your Name + Tracking ID</strong> (e.g. AliyuMA ${trackingId})</div>
                    <div class="warning-note">⚠️ Use EXACT reference format to avoid payment delays</div>
                </div>
            </div>
            <div class="detail-card">
                <div class="detail-card-header"><h3>📎 Upload Proof of Payment</h3></div>
                <p style="font-size:0.8rem;color:var(--muted);margin-bottom:1rem;">After making the transfer, upload a screenshot or photo of your payment receipt.</p>
                ${!proofBase64?`<div class="upload-area" id="uploadArea"><div class="upload-icon">📤</div><p>Click to browse or drag & drop</p><p class="upload-hint">JPG, PNG (Max 5MB)</p><input type="file" id="fileInput" accept="image/jpeg,image/png"></div>`:''}
                <div class="preview-container ${proofBase64?'active':''}" id="previewContainer"><img src="${proofBase64||''}" alt="Payment Proof" class="preview-img"><p class="file-info">${proofFileName||''}</p><div class="preview-actions"><button class="copy-btn" id="changeFileBtn">🔄 Change File</button></div></div>
                ${proofBase64?`<button class="btn-primary" id="uploadBtn" style="margin-top:1rem;"><span class="btn-spinner" id="uploadSpinner"></span>Upload Proof of Payment</button>`:''}
                ${status==='proof_sent'&&orderData.paymentProofBase64?`<div style="margin-top:1rem;padding:1rem;background:rgba(21,101,192,0.08);border:1px solid rgba(21,101,192,0.3);border-radius:var(--radius-sm);text-align:center;"><p style="color:#64B5F6;font-weight:600;margin-bottom:0.5rem;">✅ Proof Uploaded — Awaiting Verification</p><img src="${orderData.paymentProofBase64}" alt="Uploaded Proof" style="max-width:100%;max-height:200px;border-radius:var(--radius-sm);border:1px solid var(--border);"><p style="font-size:0.68rem;color:var(--muted);margin-top:0.5rem;">${orderData.paymentProofFileName||''}</p></div>`:''}
            </div>
            <div class="detail-card">
                <div class="detail-card-header"><h3>📱 Confirm via WhatsApp</h3></div>
                <a href="https://wa.me/${PAYMENT_CONFIG.whatsappNumber}?text=${PAYMENT_CONFIG.whatsappMessage(trackingId,currentUser.displayName||'User',orderData.totalPrice||0)}" target="_blank" class="btn-wa">💬 Send WhatsApp Confirmation</a>
                <p style="font-size:0.68rem;color:var(--muted);margin-top:0.6rem;text-align:center;">Or search for <strong>${PAYMENT_CONFIG.whatsappNumber}</strong> on WhatsApp</p>
            </div>
            <div class="detail-card">
                <div class="detail-card-header"><h3>📋 Payment Status</h3></div>
                <div class="tracker"><div class="tracker-line"><div class="tracker-line-fill" style="width:${trackerFillWidth};"></div></div><div class="tracker-step"><div class="tracker-dot ${step1Done?'done':'active'}">${step1Done?'✓':'1'}</div><span class="tracker-label ${step1Done?'done':'active'}">Proof Uploaded</span></div><div class="tracker-step"><div class="tracker-dot ${step2Done?'done':step2Active?'active':''}">${step2Done?'✓':'2'}</div><span class="tracker-label ${step2Done?'done':step2Active?'active':''}">Verification</span></div><div class="tracker-step"><div class="tracker-dot ${step3Done?'done':''}">${step3Done?'✓':'3'}</div><span class="tracker-label ${step3Done?'done':''}">Approved</span></div></div>
            </div>`:''}
            <div class="notes-card"><strong>📌 Important:</strong><br>⏰ Payment deadline: <strong>14 July 2025</strong><br>📦 Items collected at <strong>Day 1 Registration Desk</strong><br>❌ No refunds after confirmation<br>📞 For issues, contact via WhatsApp</div>
            <div style="display:flex;gap:0.8rem;margin-top:1.5rem;flex-wrap:wrap;"><a href="orders.html" class="btn-outline" style="flex:1;min-width:150px;">← Back to Orders</a><a href="home.html" class="btn-outline" style="flex:1;min-width:150px;">🏠 Dashboard</a></div>`;
            bindDynamicEvents();
        }

        function bindDynamicEvents() {
            const copyBtn = document.getElementById('copyAccountBtn'); if (copyBtn) copyBtn.addEventListener('click', copyAccountNumber);
            const uploadArea = document.getElementById('uploadArea'); const fileInput = document.getElementById('fileInput');
            if (uploadArea && fileInput) {
                uploadArea.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', handleFileSelect);
                ['dragenter','dragover'].forEach(ev=>uploadArea.addEventListener(ev,e=>{e.preventDefault();uploadArea.classList.add('drag-over')}));
                ['dragleave','drop'].forEach(ev=>uploadArea.addEventListener(ev,e=>{e.preventDefault();uploadArea.classList.remove('drag-over')}));
                uploadArea.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f){const dt=new DataTransfer();dt.items.add(f);fileInput.files=dt.files;handleFileSelect({target:fileInput})}});
            }
            const changeFileBtn=document.getElementById('changeFileBtn');if(changeFileBtn)changeFileBtn.addEventListener('click',changeFile);
            const uploadBtn=document.getElementById('uploadBtn');if(uploadBtn)uploadBtn.addEventListener('click',uploadProof);
        }

        function handleFileSelect(event){const f=event.target.files[0];if(!f)return;if(!['image/jpeg','image/png'].includes(f.type)){showToast('JPG or PNG only');return}if(f.size>5*1024*1024){showToast('Max 5MB');return}proofFileName=f.name;const r=new FileReader();r.onload=function(e){proofBase64=e.target.result;if(f.size>1*1024*1024){compressImage(proofBase64,800,0.7,c=>{proofBase64=c;renderPage()})}else{renderPage()}};r.readAsDataURL(f)}
        function compressImage(d,m,q,cb){const i=new Image();i.onload=function(){const cv=document.createElement('canvas');let w=i.width,h=i.height;if(w>m){h=(m/w)*h;w=m}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(i,0,0,w,h);cb(cv.toDataURL('image/jpeg',q))};i.src=d}
        function changeFile(){proofBase64=null;proofFileName=null;document.getElementById('fileInput').value='';renderPage()}

        async function uploadProof(){
            if(!proofBase64){showToast('Select a proof image first');return}
            const btn=document.getElementById('uploadBtn'),spinner=document.getElementById('uploadSpinner');btn.disabled=true;spinner.style.display='inline-block';
            try{await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb,'merchandise_orders',orderId),{paymentProofBase64:proofBase64,paymentProofFileName:proofFileName,paymentProofUploadedAt:new Date().toISOString(),status:'proof_sent'});console.log('✅ Proof uploaded');btn.disabled=false;spinner.style.display='none';showModal('Proof Uploaded! ✅','Your proof has been submitted. Admin will verify shortly.','success')}catch(e){btn.disabled=false;spinner.style.display='none';showToast('Upload failed')}
        }

        function copyAccountNumber(){navigator.clipboard.writeText(PAYMENT_CONFIG.accountNumber).then(()=>showToast('Copied! 📋')).catch(()=>showToast('Copy manually'))}

        function showModal(t,m,ty='success'){modalIconWrap.className='modal-icon-wrap '+ty;modalIcon.textContent=ty==='success'?'✅':'❌';modalTitle.textContent=t;modalMessage.textContent=m;modalButtons.innerHTML='<button class="modal-btn modal-btn-primary" id="modalGotIt">Got It</button>';modalOverlay.classList.add('active');document.body.style.overflow='hidden';document.getElementById('modalGotIt').addEventListener('click',closeModal)}
        function closeModal(){modalOverlay.classList.remove('active');document.body.style.overflow=''}
        document.getElementById('modalCloseBtn').addEventListener('click',closeModal);
        modalOverlay.addEventListener('click',function(e){if(e.target===this)closeModal()});
        document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

        function showToast(m,d=3000){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),d)}
    </script>
</body>
</html>
