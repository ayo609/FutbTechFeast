<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log — FUTB TechFest 2.0 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue:#060E1A;--navy:#0B1D3A;--navy-light:#142D5E;
            --teal:#0D9488;--teal-light:#14B8A6;--teal-pale:#CCFBF1;
            --sky:#38BDF8;--sky-light:#7DD3FC;--sky-pale:#E0F2FE;
            --white:#FFFFFF;--crimson:#EF4444;--green:#10B981;--amber:#FBBF24;--gray:#6B7280;
            --card:rgba(11,29,58,0.55);--glass:rgba(255,255,255,0.04);
            --border:rgba(56,189,248,0.15);--border-teal:rgba(20,184,166,0.4);
            --text:#E2E8F0;--text-bright:#F8FAFC;--muted:#94A3B8;--muted-light:#CBD5E1;
            --shadow-teal:0 0 30px rgba(20,184,166,0.15);--shadow-card:0 8px 40px rgba(0,0,0,0.3);
            --radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--teal) var(--deep-blue)}
        html::-webkit-scrollbar{width:5px}
        html::-webkit-scrollbar-track{background:var(--deep-blue)}
        html::-webkit-scrollbar-thumb{background:var(--teal);border-radius:3px}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--deep-blue);color:var(--text);
            min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;
        }
        body::before{
            content:'';position:fixed;inset:0;z-index:0;
            background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(56,189,248,0.08) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 50% at 90% 100%,rgba(20,184,166,0.05) 0%,transparent 55%);
            pointer-events:none;
        }
        .sidebar{width:260px;min-height:100vh;background:rgba(6,14,26,0.9);backdrop-filter:blur(20px);border-right:1px solid var(--border);padding:1.5rem 0;position:fixed;top:0;left:0;bottom:0;z-index:200;display:flex;flex-direction:column;transition:transform var(--transition)}
        .sidebar-logo{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:0.08em;background:linear-gradient(135deg,var(--teal-light),var(--sky-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;padding:0 1.5rem 1.5rem;display:block}
        .sidebar-nav{flex:1;overflow-y:auto;padding:0 0.8rem}
        .sidebar-section{font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);padding:1rem 0.7rem 0.5rem;font-family:'JetBrains Mono',monospace}
        .sidebar a{display:flex;align-items:center;gap:0.7rem;padding:0.65rem 0.8rem;border-radius:var(--radius-sm);color:var(--muted);text-decoration:none;font-size:0.8rem;font-weight:500;transition:all var(--transition);letter-spacing:0.03em}
        .sidebar a:hover{background:rgba(20,184,166,0.06);color:var(--text-bright)}
        .sidebar a.active{background:rgba(20,184,166,0.1);color:var(--teal-light);border-left:3px solid var(--teal-light)}
        .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid var(--border)}
        .sidebar-footer a{color:var(--crimson);text-decoration:none;font-size:0.75rem;display:flex;align-items:center;gap:0.5rem;font-weight:500}
        .main-content{flex:1;margin-left:260px;position:relative;z-index:1}
        .top-bar{position:sticky;top:0;z-index:100;background:rgba(6,14,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px}
        .top-bar-left{display:flex;align-items:center;gap:1rem}
        .hamburger-btn{display:none;background:none;border:none;color:var(--text-bright);font-size:1.5rem;cursor:pointer}
        .admin-pill{display:flex;align-items:center;gap:0.5rem;cursor:pointer;padding:4px 10px 4px 4px;border-radius:100px;background:var(--glass);border:1px solid var(--border);transition:all var(--transition)}
        .admin-pill:hover{border-color:var(--border-teal)}
        .admin-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.7rem;font-family:'JetBrains Mono',monospace}
        .admin-name{font-size:0.78rem;font-weight:600;color:var(--text-bright)}
        .dropdown{position:absolute;top:50px;right:0;background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius);padding:0.4rem 0;min-width:180px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:all var(--transition);z-index:300}
        .dropdown.active{opacity:1;visibility:visible;transform:translateY(0)}
        .dropdown a,.dropdown button{display:flex;align-items:center;gap:0.5rem;width:100%;text-align:left;padding:0.6rem 1.2rem;color:var(--muted-light);font-size:0.78rem;background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all var(--transition)}
        .dropdown a:hover,.dropdown button:hover{background:rgba(20,184,166,0.06);color:var(--text-bright)}
        .dropdown .logout-btn{color:var(--crimson)}.dropdown .logout-btn:hover{color:#FCA5A5}

        .page-content{padding:2rem}
        .page-header{margin-bottom:1.5rem}
        .page-header h1{font-size:1.5rem;font-weight:700;color:var(--text-bright);margin-bottom:0.3rem}
        .page-header p{font-size:0.82rem;color:var(--muted)}
        .total-badge{display:inline-block;background:rgba(20,184,166,0.1);border:1px solid var(--border-teal);padding:0.25rem 0.8rem;border-radius:100px;font-size:0.7rem;color:var(--teal-light);font-family:'JetBrains Mono',monospace;margin-left:0.5rem}

        .filter-bar{display:flex;gap:0.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
        .filter-bar input,.filter-bar select{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-bright);padding:0.5rem 0.9rem;border-radius:100px;font-size:0.75rem;font-family:'Space Grotesk',sans-serif;transition:all var(--transition)}
        .filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:var(--teal-light)}
        .filter-bar select option{background:var(--navy);color:var(--text-bright)}
        .filter-bar input{width:220px}
        .btn-export{background:var(--teal-light);color:white;border:none;padding:0.5rem 1.2rem;border-radius:100px;font-weight:700;font-size:0.75rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all var(--transition);margin-left:auto}
        .btn-export:hover{background:var(--teal)}
        .btn-clear-log{background:transparent;border:1px solid rgba(239,68,68,0.4);color:var(--crimson);padding:0.5rem 1.2rem;border-radius:100px;font-weight:600;font-size:0.75rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all var(--transition)}
        .btn-clear-log:hover{background:rgba(239,68,68,0.1)}

        .log-list{display:flex;flex-direction:column;gap:0.4rem}
        .log-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:0.9rem 1.2rem;display:flex;align-items:center;gap:1rem;transition:all var(--transition)}
        .log-item:hover{border-color:var(--border-teal)}
        .log-icon{font-size:1.1rem;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .log-icon.user{background:rgba(56,189,248,0.1)}.log-icon.payment{background:rgba(16,185,129,0.1)}
        .log-icon.schedule{background:rgba(20,184,166,0.1)}.log-icon.system{background:rgba(107,114,128,0.1)}
        .log-icon.delete{background:rgba(239,68,68,0.1)}
        .log-info{flex:1}
        .log-info .log-action{font-size:0.82rem;color:var(--text-bright);font-weight:500}
        .log-info .log-meta{font-size:0.66rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:0.15rem}
        .log-time{font-size:0.7rem;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap}

        .pagination{display:flex;align-items:center;justify-content:center;gap:0.4rem;margin-top:1.5rem}
        .pagination button{padding:0.4rem 0.8rem;border-radius:var(--radius-sm);font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--glass);color:var(--muted);transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .pagination button:hover,.pagination button.active{border-color:var(--teal-light);color:var(--teal-light);background:rgba(20,184,166,0.08)}
        .pagination button:disabled{opacity:0.3;cursor:not-allowed}

        .modal-overlay{position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition);padding:1rem}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-box{background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius-lg);padding:2rem;max-width:440px;width:100%;position:relative;text-align:center}
        .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer}
        .modal-box h3{font-size:1.1rem;font-weight:700;color:var(--text-bright);margin-bottom:0.8rem}
        .modal-box p{color:var(--muted-light);font-size:0.82rem;margin-bottom:1rem}
        .btn-danger{background:var(--crimson);color:white;padding:0.6rem 1.5rem;border-radius:100px;font-weight:700;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid var(--border-teal);color:var(--text-bright);padding:0.7rem 1.5rem;border-radius:100px;font-size:0.8rem;font-weight:500;z-index:500;opacity:0;visibility:hidden;transition:all var(--transition);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
        .toast.show{opacity:1;visibility:visible;bottom:40px}

        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
            .main-content{margin-left:0}.hamburger-btn{display:block}
            .page-content{padding:1.5rem 1rem}.log-item{flex-wrap:wrap}
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <a href="admin.html" class="sidebar-logo">TechFest Admin</a>
        <nav class="sidebar-nav">
            <div class="sidebar-section">Main</div><a href="admin.html">📊 Dashboard</a>
            <div class="sidebar-section">Management</div><a href="admin-users.html">👥 Users</a><a href="admin-orders.html">🛍️ Orders</a><a href="admin-payments.html">💳 Payments</a>
            <div class="sidebar-section">Content</div><a href="admin-schedule.html">📅 Schedule</a><a href="admin-announcements.html">📢 Announcements</a><a href="admin-notifications.html">🔔 Notifications</a><a href="admin-merchandise.html">🛍️ Merchandise</a>
            <div class="sidebar-section">System</div><a href="admin-analytics.html">📊 Analytics</a><a href="admin-settings.html">⚙️ Settings</a><a href="admin-activity-log.html" class="active">📜 Activity Log</a>
        </nav>
        <div class="sidebar-footer"><a href="index.html" target="_blank">🔗 View Site</a></div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <div class="top-bar-left"><button class="hamburger-btn" id="hamburgerBtn">☰</button></div>
            <div class="top-bar-right">
                <div style="position:relative">
                    <div class="admin-pill" id="adminPill"><div class="admin-avatar" id="adminAvatar">A</div><span class="admin-name" id="adminName">Admin</span></div>
                    <div class="dropdown" id="adminDropdown"><a href="admin-settings.html">⚙️ Settings</a><button class="logout-btn" id="logoutBtn">🚪 Logout</button></div>
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="page-header"><h1>📜 Activity Log<span class="total-badge" id="totalBadge">0 entries</span></h1><p>Track all admin actions across the system</p></div>

            <div class="filter-bar">
                <input type="text" id="searchLog" placeholder="🔍 Search log entries...">
                <select id="filterAction"><option value="">All Actions</option><option value="user">👤 User Actions</option><option value="payment">💳 Payment Actions</option><option value="schedule">📅 Schedule Actions</option><option value="system">⚙️ System Actions</option></select>
                <button class="btn-clear-log" id="btnClearLog">🗑️ Clear Old Logs (90+ days)</button>
                <button class="btn-export" id="btnExportLog">📥 Export CSV</button>
            </div>

            <div class="log-list" id="logList"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, where, getDocs, onSnapshot, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig={apiKey:"AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",authDomain:"futbtechfeast.firebaseapp.com",projectId:"futbtechfeast",storageBucket:"futbtechfeast.firebasestorage.app",messagingSenderId:"64095326173",appId:"1:64095326173:web:3f7cda8b0040ab2ea53034"};
        const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
        window.firebaseAuth=auth;window.firebaseDb=db;window.firebaseSignOut=signOut;window.firebaseDoc=doc;window.firebaseGetDoc=getDoc;window.firebaseCollection=collection;window.firebaseQuery=query;window.firebaseOrderBy=orderBy;window.firebaseWhere=where;window.firebaseGetDocs=getDocs;window.firebaseOnSnapshot=onSnapshot;window.firebaseDeleteDoc=deleteDoc;window.firebaseServerTimestamp=serverTimestamp;
        console.log("✅ Firebase Admin initialized");
    </script>

    <script>
        let currentAdmin=null,allLogs=[],currentPage=1,pageSize=20;
        const sidebar=document.getElementById('sidebar'),hamburgerBtn=document.getElementById('hamburgerBtn'),adminAvatar=document.getElementById('adminAvatar'),adminName=document.getElementById('adminName'),adminDropdown=document.getElementById('adminDropdown'),modalOverlay=document.getElementById('modalOverlay'),modalBox=document.getElementById('modalBox'),toast=document.getElementById('toast');

        hamburgerBtn.addEventListener('click',()=>sidebar.classList.toggle('open'));
        document.addEventListener('click',(e)=>{if(!e.target.closest('#sidebar')&&!e.target.closest('#hamburgerBtn')&&sidebar.classList.contains('open'))sidebar.classList.remove('open')});
        document.getElementById('adminPill').addEventListener('click',()=>adminDropdown.classList.toggle('active'));
        document.addEventListener('click',(e)=>{if(!e.target.closest('#adminPill')&&!e.target.closest('#adminDropdown'))adminDropdown.classList.remove('active')});
        document.getElementById('logoutBtn').addEventListener('click',async()=>{await window.firebaseSignOut(window.firebaseAuth);window.location.href='admin-login.html'});

        function waitForFirebase(cb){if(window.firebaseOnSnapshot&&window.firebaseAuth){cb()}else{setTimeout(()=>waitForFirebase(cb),150)}}
        waitForFirebase(()=>{window.firebaseOnAuthStateChanged(window.firebaseAuth,async(user)=>{if(!user){window.location.href='admin-login.html';return}const ad=await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDb,'admins',user.uid));if(!ad.exists()||ad.data().role!=='admin'){await window.firebaseSignOut(window.firebaseAuth);window.location.href='admin-login.html';return}currentAdmin=user;adminAvatar.textContent=(ad.data().name||'A').charAt(0).toUpperCase();adminName.textContent=ad.data().name||'Admin';loadLogs()})});

        function loadLogs(){window.firebaseOnSnapshot(window.firebaseQuery(window.firebaseCollection(window.firebaseDb,'activity_log'),window.firebaseOrderBy('createdAt','desc')),(snap)=>{allLogs=[];snap.forEach(doc=>allLogs.push({id:doc.id,...doc.data()}));document.getElementById('totalBadge').textContent=allLogs.length+' entries';renderLogs()})}

        document.getElementById('searchLog').addEventListener('input',debounce(()=>{currentPage=1;renderLogs()},300));
        document.getElementById('filterAction').addEventListener('change',()=>{currentPage=1;renderLogs()});

        function getActionCategory(action){const a=(action||'').toLowerCase();if(a.includes('user')||a.includes('registration')||a.includes('status'))return'user';if(a.includes('payment')||a.includes('approve')||a.includes('confirm'))return'payment';if(a.includes('schedule')||a.includes('event')||a.includes('live'))return'schedule';if(a.includes('delete')||a.includes('remove'))return'delete';return'system'}
        function getActionIcon(cat){return{user:'👤',payment:'💳',schedule:'📅',system:'⚙️',delete:'🗑️'}[cat]||'📜'}

        function renderLogs(){
            const search=document.getElementById('searchLog').value.toLowerCase(),fa=document.getElementById('filterAction').value;
            let filtered=allLogs.filter(l=>{if(search&&!((l.action||'').toLowerCase().includes(search)&&(l.admin||'').toLowerCase().includes(search)))return false;if(fa&&getActionCategory(l.action)!==fa)return false;return true});
            const start=(currentPage-1)*pageSize,end=start+pageSize,pageData=filtered.slice(start,end);
            document.getElementById('logList').innerHTML=pageData.length===0?'<p style="color:var(--muted);text-align:center;padding:3rem;">No activity logs found</p>':pageData.map(l=>{const cat=getActionCategory(l.action),icon=getActionIcon(cat),date=l.createdAt?.toDate?.()||new Date();return'<div class="log-item"><div class="log-icon '+cat+'">'+icon+'</div><div class="log-info"><div class="log-action">'+ (l.action||'Unknown action')+'</div><div class="log-meta">Admin: '+(l.admin||'System')+'</div></div><div class="log-time">'+date.toLocaleString()+'</div></div>'}).join('');
            renderPagination(filtered.length);
        }

        function renderPagination(total){const tp=Math.ceil(total/pageSize);let h='<button '+(currentPage===1?'disabled':'')+' onclick="goToPage('+(currentPage-1)+')">← Prev</button>';for(let i=1;i<=tp;i++){if(i===1||i===tp||Math.abs(i-currentPage)<=2)h+='<button class="'+(i===currentPage?'active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';else if(!h.endsWith('...'))h+='<span style="color:var(--muted);">...</span>'}h+='<button '+(currentPage===tp?'disabled':'')+' onclick="goToPage('+(currentPage+1)+')">Next →</button>';document.getElementById('pagination').innerHTML=tp>1?h:''}
        function goToPage(p){currentPage=p;renderLogs();window.scrollTo({top:0,behavior:'smooth'})}

        document.getElementById('btnClearLog').addEventListener('click',()=>{modalBox.innerHTML='<button class="modal-close" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'active\')">✕</button><h3>🗑️ Clear Old Logs?</h3><p style="color:var(--muted);">Delete all log entries older than 90 days?</p><button class="btn-danger" id="btnConfirmClear">Clear Old Logs</button>';modalOverlay.classList.add('active');document.getElementById('btnConfirmClear').addEventListener('click',async()=>{const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);let count=0;for(const l of allLogs){const d=l.createdAt?.toDate?.()||new Date();if(d<cutoff){await window.firebaseDeleteDoc(window.firebaseDoc(window.firebaseDb,'activity_log',l.id));count++}}modalOverlay.classList.remove('active');showToast('Cleared '+count+' old log entries!')})});

        document.getElementById('btnExportLog').addEventListener('click',()=>{let csv='Date,Admin,Action\n';allLogs.forEach(l=>{const d=l.createdAt?.toDate?.()||new Date();csv+='"'+d.toISOString()+'","'+(l.admin||'')+'","'+(l.action||'')+'"\n'});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='activity_log_'+new Date().toISOString().slice(0,10)+'.csv';a.click();showToast('CSV exported!')});

        modalOverlay.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active')});
        function showToast(m,d=3000){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),d)}
        function debounce(fn,d){let t;return function(...args){clearTimeout(t);t=setTimeout(()=>fn.apply(this,args),d)}}

        window.goToPage=goToPage;
    </script>
</body>
</html>
