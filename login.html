<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FUTB TechFest 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:#0D2B4E;--navy-deep:#06182B;--gold:#C8960C;--gold-light:#F0B429;--gold-pale:#FCEABB;
            --blue:#1565C0;--crimson:#B71C1C;--green:#00C853;--dark:#080F1A;--darker:#040810;
            --card:rgba(13,43,78,0.55);--glass:rgba(255,255,255,0.04);--border:rgba(200,150,12,0.2);
            --border-gold:rgba(200,150,12,0.4);--text:#E8F0FF;--text-bright:#FFFFFF;
            --muted:#8899BB;--muted-light:#A0B0CC;--shadow-gold:0 0 30px rgba(200,150,12,0.15);
            --shadow-card:0 8px 40px rgba(0,0,0,0.3);--radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--darker);color:var(--text);
            min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
            -webkit-font-smoothing:antialiased;position:relative;
        }
        body::before{
            content:'';position:fixed;inset:0;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events:none;z-index:0;opacity:0.35;
        }
        body::after{
            content:'';position:fixed;inset:0;
            background:radial-gradient(ellipse at 50% 30%,rgba(21,101,192,0.15) 0%,transparent 60%),
                       radial-gradient(ellipse at 80% 100%,rgba(200,150,12,0.1) 0%,transparent 50%);
            pointer-events:none;z-index:0;
        }
        .login-container{
            position:relative;z-index:1;width:100%;max-width:460px;background:var(--card);
            border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.5rem;
            backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow-card);
        }
        .login-header{text-align:center;margin-bottom:2.5rem}
        .login-logo{
            font-family:'Bebas Neue',cursive;font-size:1.8rem;letter-spacing:0.08em;
            background:linear-gradient(135deg,var(--gold),var(--gold-light));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;text-decoration:none;display:inline-block;margin-bottom:0.8rem;
        }
        .login-header h2{font-size:1.4rem;font-weight:700;color:var(--text-bright);margin-bottom:0.3rem}
        .login-header p{font-size:0.82rem;color:var(--muted);line-height:1.5}
        .form-group{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:1.2rem}
        .form-group label{font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
        .form-group input{
            background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.12);
            color:var(--text-bright);padding:0.8rem 1rem;border-radius:var(--radius-sm);
            font-size:0.9rem;font-family:'Space Grotesk',sans-serif;transition:all var(--transition);width:100%;
        }
        .form-group input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,12,0.1)}
        .form-group input.error{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(183,28,28,0.1)}
        .error-msg{font-size:0.7rem;color:#EF5350;display:none;letter-spacing:0.03em}
        .error-msg.show{display:block}
        .password-wrap{position:relative}
        .password-toggle{
            position:absolute;right:12px;top:50%;transform:translateY(-50%);
            background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;
            padding:4px;transition:color var(--transition);z-index:2;
        }
        .password-toggle:hover{color:var(--text-bright)}
        .options-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.5rem}
        .remember-me{display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.78rem;color:var(--muted-light)}
        .remember-me input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}
        .forgot-password{font-size:0.78rem;color:var(--gold-light);text-decoration:none;font-weight:500;transition:color var(--transition);cursor:pointer;background:none;border:none;font-family:'Space Grotesk',sans-serif}
        .forgot-password:hover{color:var(--gold-pale);text-decoration:underline}
        .btn-login{
            background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-deep);
            padding:0.9rem 2rem;border-radius:100px;font-weight:700;font-size:0.95rem;
            border:none;cursor:pointer;letter-spacing:0.04em;transition:all var(--transition);
            font-family:'Space Grotesk',sans-serif;box-shadow:0 6px 25px rgba(200,150,12,0.3);
            width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:0.5rem;
        }
        .btn-login:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 35px rgba(200,150,12,0.45)}
        .btn-login:disabled{opacity:0.5;cursor:not-allowed}
        .btn-spinner{display:none;width:20px;height:20px;border:2.5px solid transparent;border-top-color:var(--navy-deep);border-radius:50%;animation:spin 0.7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .register-link{text-align:center;margin-top:1.5rem;font-size:0.82rem;color:var(--muted)}
        .register-link a{color:var(--gold-light);text-decoration:none;font-weight:600;transition:color var(--transition)}
        .register-link a:hover{color:var(--gold-pale)}
        .back-home-link{text-align:center;margin-top:0.8rem;font-size:0.78rem}
        .back-home-link a{color:var(--muted);text-decoration:none;transition:color var(--transition)}
        .back-home-link a:hover{color:var(--text-bright)}
        .divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:var(--muted);font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
        .modal-overlay{
            position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);
            backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
            display:flex;align-items:center;justify-content:center;
            opacity:0;visibility:hidden;transition:all var(--transition);padding:1rem;
        }
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-box{
            background:var(--navy);border:1px solid var(--border-gold);border-radius:var(--radius-lg);
            padding:2.5rem 2rem;max-width:440px;width:100%;text-align:center;position:relative;
            box-shadow:0 30px 70px rgba(0,0,0,0.6);transform:translateY(20px);
            transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        .modal-overlay.active .modal-box{transform:translateY(0)}
        .modal-icon-wrap{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:2rem}
        .modal-icon-wrap.success{background:rgba(0,200,83,0.12);border:2px solid rgba(0,200,83,0.3)}
        .modal-icon-wrap.error{background:rgba(183,28,28,0.12);border:2px solid rgba(183,28,28,0.3)}
        .modal-icon-wrap.info{background:rgba(21,101,192,0.12);border:2px solid rgba(21,101,192,0.3)}
        .modal-box h3{font-size:1.3rem;font-weight:700;margin-bottom:0.6rem;color:var(--text-bright)}
        .modal-box p{color:var(--muted-light);font-size:0.88rem;line-height:1.7;margin-bottom:1.5rem}
        .modal-close{position:absolute;top:1rem;right:1.2rem;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
        .modal-close:hover{color:var(--text-bright);background:rgba(255,255,255,0.06)}
        .modal-btn{padding:0.8rem 2rem;border-radius:100px;font-weight:700;font-size:0.9rem;cursor:pointer;border:none;letter-spacing:0.04em;transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .modal-btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy-deep);box-shadow:0 6px 25px rgba(200,150,12,0.3)}
        .modal-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(200,150,12,0.5)}
        @media(max-width:480px){
            body{padding:1rem}
            .login-container{padding:1.8rem 1.3rem;border-radius:var(--radius)}
            .login-logo{font-size:1.5rem}
            .login-header h2{font-size:1.2rem}
            .options-row{flex-direction:column;align-items:flex-start}
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <a href="index.html" class="login-logo">TechFest 2.0</a>
            <h2>Welcome Back</h2>
            <p>Login to access your dashboard and manage your registration.</p>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@email.com" autocomplete="email">
            <span class="error-msg" id="err-email">Please enter a valid email address</span>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrap">
                <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                <button type="button" class="password-toggle" id="pwToggle">👁️</button>
            </div>
            <span class="error-msg" id="err-password">Password is required</span>
        </div>

        <div class="options-row">
            <label class="remember-me"><input type="checkbox" id="rememberMe"> Remember me</label>
            <button class="forgot-password" id="forgotBtn">Forgot Password?</button>
        </div>

        <button class="btn-login" id="loginBtn"><span class="btn-spinner" id="loginSpinner"></span>Login to Dashboard</button>

        <div class="divider">or</div>

        <div class="register-link">Don't have an account? <a href="register.html">Create Account</a></div>
        <div class="back-home-link"><a href="index.html">← Back to Home</a></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <div class="modal-icon-wrap" id="modalIconWrap"><span id="modalIcon">✅</span></div>
            <h3 id="modalTitle">Success</h3>
            <p id="modalMessage">Action completed.</p>
            <button class="modal-btn modal-btn-primary" id="modalBtn">Got It</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",
            authDomain: "futbtechfeast.firebaseapp.com",
            projectId: "futbtechfeast",
            storageBucket: "futbtechfeast.firebasestorage.app",
            messagingSenderId: "64095326173",
            appId: "1:64095326173:web:3f7cda8b0040ab2ea53034"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        console.log("✅ Firebase Auth initialized");
    </script>

    <script>
        // ═══════════ DOM REFS ═══════════
        const loginEmail=document.getElementById('loginEmail');
        const loginPassword=document.getElementById('loginPassword');
        const errEmail=document.getElementById('err-email');
        const errPassword=document.getElementById('err-password');
        const loginBtn=document.getElementById('loginBtn');
        const loginSpinner=document.getElementById('loginSpinner');
        const rememberMe=document.getElementById('rememberMe');
        const modalOverlay=document.getElementById('modalOverlay');
        const modalIconWrap=document.getElementById('modalIconWrap');
        const modalIcon=document.getElementById('modalIcon');
        const modalTitle=document.getElementById('modalTitle');
        const modalMessage=document.getElementById('modalMessage');
        const modalBtn=document.getElementById('modalBtn');

        // ═══════════ PASSWORD TOGGLE ═══════════
        document.getElementById('pwToggle').addEventListener('click',function(){
            loginPassword.type=loginPassword.type==='password'?'text':'password';
            this.textContent=loginPassword.type==='password'?'👁️':'🙈';
        });

        // ═══════════ VALIDATION ═══════════
        function showFieldError(input,err,show){
            if(show){input.classList.add('error');err.classList.add('show')}
            else{input.classList.remove('error');err.classList.remove('show')}
        }
        function validateForm(){
            let valid=true;
            const email=loginEmail.value.trim();
            const pw=loginPassword.value;
            if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showFieldError(loginEmail,errEmail,true);valid=false}
            else showFieldError(loginEmail,errEmail,false);
            if(!pw){showFieldError(loginPassword,errPassword,true);valid=false}
            else showFieldError(loginPassword,errPassword,false);
            return valid;
        }

        // ═══════════ LOGIN ═══════════
        async function handleLogin(){
            if(!validateForm())return;
            loginBtn.disabled=true;loginSpinner.style.display='inline-block';
            const email=loginEmail.value.trim();
            const password=loginPassword.value;
            try{
                console.log('🔐 Attempting login:',email);
                const persistence=rememberMe.checked?browserLocalPersistence:browserSessionPersistence;
                await setPersistence(auth,persistence);
                const uc=await signInWithEmailAndPassword(auth,email,password);
                console.log('✅ Login success:',uc.user.uid);
                const name=uc.user.displayName||email.split('@')[0];
                showModal('Login Successful! 🎉',`Welcome back, <strong>${name}</strong>! Redirecting...`,'success');
                setTimeout(()=>{window.location.href='home.html';},2000);
            }catch(error){
                console.error('❌ Login error:',error.code,error.message);
                loginBtn.disabled=false;loginSpinner.style.display='none';
                let title='Login Failed',msg='',type='error';
                switch(error.code){
                    case'auth/invalid-credential':case'auth/user-not-found':case'auth/wrong-password':
                        title='Invalid Credentials';msg='The email or password you entered is incorrect.';showFieldError(loginEmail,errEmail,true);errEmail.textContent='Invalid email or password';break;
                    case'auth/invalid-email':title='Invalid Email';msg='Please enter a valid email.';showFieldError(loginEmail,errEmail,true);break;
                    case'auth/too-many-requests':title='Account Locked';msg='Too many failed attempts. Try again later or reset your password.';break;
                    case'auth/network-request-failed':title='Network Error';msg='Unable to connect. Check your internet.';break;
                    case'auth/operation-not-allowed':title='Login Disabled';msg='Email/Password sign-in is not enabled in Firebase Console.';break;
                    default:msg=error.message||'An unexpected error occurred.';break;
                }
                showModal(title,msg,type);
            }
        }

        // ═══════════ FORGOT PASSWORD ═══════════
        async function forgotPassword(){
            const email=loginEmail.value.trim();
            if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showModal('Email Required','Enter your email first then click Forgot Password.','info');loginEmail.focus();return}
            try{
                await sendPasswordResetEmail(auth,email);
                showModal('Reset Email Sent! 📧',`A reset link has been sent to <strong>${email}</strong>. Check your inbox and spam folder.`,'success');
            }catch(error){
                console.error('Reset error:',error.code);
                let msg='Unable to send reset email.';
                if(error.code==='auth/user-not-found')msg='No account found with this email. <a href="register.html" style="color:var(--gold-light);">Create one here</a>.';
                else if(error.code==='auth/too-many-requests')msg='Too many requests. Wait a moment.';
                showModal('Reset Failed',msg,'error');
            }
        }

        // ═══════════ MODAL ═══════════
        function showModal(title,msg,type='success'){
            modalIconWrap.className='modal-icon-wrap '+type;
            modalIcon.textContent={success:'✅',error:'❌',info:'ℹ️'}[type]||'✅';
            modalTitle.textContent=title;modalMessage.innerHTML=msg;
            modalBtn.textContent=type==='success'?'Got It':'Try Again';
            modalOverlay.classList.add('active');document.body.style.overflow='hidden';
        }
        function closeModal(){modalOverlay.classList.remove('active');document.body.style.overflow='';}

        // ═══════════ EVENT LISTENERS ═══════════
        document.getElementById('loginBtn').addEventListener('click',handleLogin);
        document.getElementById('forgotBtn').addEventListener('click',forgotPassword);
        document.getElementById('modalCloseBtn').addEventListener('click',closeModal);
        document.getElementById('modalBtn').addEventListener('click',closeModal);
        modalOverlay.addEventListener('click',function(e){if(e.target===this)closeModal();});
        document.addEventListener('keydown',function(e){
            if(e.key==='Escape')closeModal();
            if(e.key==='Enter'&&document.activeElement&&document.activeElement.closest('.login-container')){e.preventDefault();handleLogin();}
        });

        // ═══════════ AUTO-REDIRECT IF LOGGED IN ═══════════
        onAuthStateChanged(auth,(user)=>{
            if(user){console.log('Already logged in → redirecting');window.location.href='home.html';}
        });
        console.log('✅ Login page ready');
    </script>
</body>
</html>
