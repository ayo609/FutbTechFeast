<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements — FUTB TechFest 2.0 Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue:#060E1A;--navy:#0B1D3A;--navy-light:#142D5E;
            --teal:#0D9488;--teal-light:#14B8A6;--teal-pale:#CCFBF1;
            --sky:#38BDF8;--sky-light:#7DD3FC;--sky-pale:#E0F2FE;
            --white:#FFFFFF;--crimson:#EF4444;--green:#10B981;--amber:#FBBF24;--gray:#6B7280;
            --card:rgba(11,29,58,0.55);--glass:rgba(255,255,255,0.04);
            --border:rgba(56,189,248,0.15);--border-teal:rgba(20,184,166,0.4);
            --text:#E2E8F0;--text-bright:#F8FAFC;--muted:#94A3B8;--muted-light:#CBD5E1;
            --shadow-teal:0 0 30px rgba(20,184,166,0.15);--shadow-card:0 8px 40px rgba(0,0,0,0.3);
            --radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--teal) var(--deep-blue)}
        html::-webkit-scrollbar{width:5px}
        html::-webkit-scrollbar-track{background:var(--deep-blue)}
        html::-webkit-scrollbar-thumb{background:var(--teal);border-radius:3px}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--deep-blue);color:var(--text);
            min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;
        }
        body::before{
            content:'';position:fixed;inset:0;z-index:0;
            background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(56,189,248,0.08) 0%,transparent 60%),
                       radial-gradient(ellipse 60% 50% at 90% 100%,rgba(20,184,166,0.05) 0%,transparent 55%);
            pointer-events:none;
        }
        .sidebar{width:260px;min-height:100vh;background:rgba(6,14,26,0.9);backdrop-filter:blur(20px);border-right:1px solid var(--border);padding:1.5rem 0;position:fixed;top:0;left:0;bottom:0;z-index:200;display:flex;flex-direction:column;transition:transform var(--transition)}
        .sidebar-logo{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:0.08em;background:linear-gradient(135deg,var(--teal-light),var(--sky-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;padding:0 1.5rem 1.5rem;display:block}
        .sidebar-nav{flex:1;overflow-y:auto;padding:0 0.8rem}
        .sidebar-section{font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);padding:1rem 0.7rem 0.5rem;font-family:'JetBrains Mono',monospace}
        .sidebar a{display:flex;align-items:center;gap:0.7rem;padding:0.65rem 0.8rem;border-radius:var(--radius-sm);color:var(--muted);text-decoration:none;font-size:0.8rem;font-weight:500;transition:all var(--transition);letter-spacing:0.03em}
        .sidebar a:hover{background:rgba(20,184,166,0.06);color:var(--text-bright)}
        .sidebar a.active{background:rgba(20,184,166,0.1);color:var(--teal-light);border-left:3px solid var(--teal-light)}
        .sidebar-footer{padding:1rem 1.5rem;border-top:1px solid var(--border)}
        .sidebar-footer a{color:var(--crimson);text-decoration:none;font-size:0.75rem;display:flex;align-items:center;gap:0.5rem;font-weight:500}
        .main-content{flex:1;margin-left:260px;position:relative;z-index:1}
        .top-bar{position:sticky;top:0;z-index:100;background:rgba(6,14,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px}
        .top-bar-left{display:flex;align-items:center;gap:1rem}
        .hamburger-btn{display:none;background:none;border:none;color:var(--text-bright);font-size:1.5rem;cursor:pointer}
        .admin-pill{display:flex;align-items:center;gap:0.5rem;cursor:pointer;padding:4px 10px 4px 4px;border-radius:100px;background:var(--glass);border:1px solid var(--border);transition:all var(--transition)}
        .admin-pill:hover{border-color:var(--border-teal)}
        .admin-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.7rem;font-family:'JetBrains Mono',monospace}
        .admin-name{font-size:0.78rem;font-weight:600;color:var(--text-bright)}
        .dropdown{position:absolute;top:50px;right:0;background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius);padding:0.4rem 0;min-width:180px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:all var(--transition);z-index:300}
        .dropdown.active{opacity:1;visibility:visible;transform:translateY(0)}
        .dropdown a,.dropdown button{display:flex;align-items:center;gap:0.5rem;width:100%;text-align:left;padding:0.6rem 1.2rem;color:var(--muted-light);font-size:0.78rem;background:none;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all var(--transition)}
        .dropdown a:hover,.dropdown button:hover{background:rgba(20,184,166,0.06);color:var(--text-bright)}
        .dropdown .logout-btn{color:var(--crimson)}.dropdown .logout-btn:hover{color:#FCA5A5}

        .page-content{padding:2rem}
        .page-header{margin-bottom:1.5rem}
        .page-header h1{font-size:1.5rem;font-weight:700;color:var(--text-bright);margin-bottom:0.3rem}
        .page-header p{font-size:0.82rem;color:var(--muted)}
        .total-badge{display:inline-block;background:rgba(20,184,166,0.1);border:1px solid var(--border-teal);padding:0.25rem 0.8rem;border-radius:100px;font-size:0.7rem;color:var(--teal-light);font-family:'JetBrains Mono',monospace;margin-left:0.5rem}

        .create-card{background:var(--card);border:1px solid var(--border-teal);border-radius:var(--radius);padding:1.5rem;margin-bottom:2rem}
        .create-card h3{font-size:1rem;font-weight:700;color:var(--teal-light);margin-bottom:1rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:0.8rem}
        .form-group{display:flex;flex-direction:column;gap:0.25rem}
        .form-group.full{grid-column:1/-1}
        .form-group label{font-size:0.65rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted)}
        .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.12);color:var(--text-bright);padding:0.6rem 0.8rem;border-radius:var(--radius-sm);font-size:0.8rem;font-family:'Space Grotesk',sans-serif;width:100%}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--teal-light)}
        .form-group select option{background:var(--navy);color:var(--text-bright)}
        .form-group textarea{resize:vertical;min-height:80px}
        .btn-send{background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);padding:0.7rem 2rem;border-radius:100px;font-weight:700;font-size:0.85rem;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all var(--transition)}
        .btn-send:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(20,184,166,0.4)}

        .announcement-list{display:flex;flex-direction:column;gap:0.8rem}
        .ann-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.5rem;transition:all var(--transition)}
        .ann-card:hover{border-color:var(--border-teal)}
        .ann-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.6rem;margin-bottom:0.5rem}
        .ann-title{font-size:0.9rem;font-weight:600;color:var(--text-bright)}
        .priority-badge{padding:0.2rem 0.7rem;border-radius:100px;font-size:0.6rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
        .priority-normal{background:rgba(107,114,128,0.1);color:var(--gray);border:1px solid rgba(107,114,128,0.3)}
        .priority-important{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.3)}
        .priority-urgent{background:rgba(239,68,68,0.1);color:var(--crimson);border:1px solid rgba(239,68,68,0.3)}
        .ann-date{font-size:0.68rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
        .ann-content{font-size:0.82rem;color:var(--muted-light);line-height:1.6;margin-bottom:0.6rem}
        .ann-actions{display:flex;gap:0.5rem}
        .btn-sm{padding:0.3rem 0.8rem;border-radius:100px;font-size:0.68rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .btn-sm:hover{border-color:var(--teal-light);color:var(--teal-light)}
        .btn-sm.danger:hover{border-color:var(--crimson);color:var(--crimson)}

        .edit-form{display:none;margin-top:0.8rem;padding:1rem;background:rgba(0,0,0,0.2);border-radius:var(--radius-sm)}
        .edit-form.active{display:block}
        .btn-save-sm{background:var(--teal-light);color:white;padding:0.4rem 1rem;border-radius:100px;font-weight:600;font-size:0.7rem;border:none;cursor:pointer;margin-right:0.5rem;font-family:'Space Grotesk',sans-serif}
        .btn-cancel-sm{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.4rem 1rem;border-radius:100px;font-size:0.7rem;cursor:pointer;font-family:'Space Grotesk',sans-serif}

        .pagination{display:flex;align-items:center;justify-content:center;gap:0.4rem;margin-top:1.5rem}
        .pagination button{padding:0.4rem 0.8rem;border-radius:var(--radius-sm);font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--glass);color:var(--muted);transition:all var(--transition);font-family:'Space Grotesk',sans-serif}
        .pagination button:hover,.pagination button.active{border-color:var(--teal-light);color:var(--teal-light);background:rgba(20,184,166,0.08)}
        .pagination button:disabled{opacity:0.3;cursor:not-allowed}

        .modal-overlay{position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition);padding:1rem}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-box{background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius-lg);padding:2rem;max-width:440px;width:100%;position:relative;text-align:center}
        .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer}
        .btn-danger{background:var(--crimson);color:white;padding:0.6rem 1.5rem;border-radius:100px;font-weight:700;border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--navy);border:1px solid var(--border-teal);color:var(--text-bright);padding:0.7rem 1.5rem;border-radius:100px;font-size:0.8rem;font-weight:500;z-index:500;opacity:0;visibility:hidden;transition:all var(--transition);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
        .toast.show{opacity:1;visibility:visible;bottom:40px}

        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
            .main-content{margin-left:0}.hamburger-btn{display:block}
            .page-content{padding:1.5rem 1rem}.form-row{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <a href="admin.html" class="sidebar-logo">TechFest Admin</a>
        <nav class="sidebar-nav">
            <div class="sidebar-section">Main</div><a href="admin.html">📊 Dashboard</a>
            <div class="sidebar-section">Management</div><a href="admin-users.html">👥 Users</a><a href="admin-orders.html">🛍️ Orders</a><a href="admin-payments.html">💳 Payments</a>
            <div class="sidebar-section">Content</div><a href="admin-schedule.html">📅 Schedule</a><a href="admin-announcements.html" class="active">📢 Announcements</a><a href="admin-notifications.html">🔔 Notifications</a><a href="admin-merchandise.html">🛍️ Merchandise</a>
            <div class="sidebar-section">System</div><a href="admin-analytics.html">📊 Analytics</a><a href="admin-settings.html">⚙️ Settings</a><a href="admin-activity-log.html">📜 Activity Log</a>
        </nav>
        <div class="sidebar-footer"><a href="index.html" target="_blank">🔗 View Site</a></div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <div class="top-bar-left"><button class="hamburger-btn" id="hamburgerBtn">☰</button></div>
            <div class="top-bar-right">
                <div style="position:relative">
                    <div class="admin-pill" id="adminPill"><div class="admin-avatar" id="adminAvatar">A</div><span class="admin-name" id="adminName">Admin</span></div>
                    <div class="dropdown" id="adminDropdown"><a href="admin-settings.html">⚙️ Settings</a><button class="logout-btn" id="logoutBtn">🚪 Logout</button></div>
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="page-header"><h1>📢 Announcements<span class="total-badge" id="totalBadge">0</span></h1><p>Create and manage announcements for all users</p></div>

            <div class="create-card">
                <h3>✍️ Create Announcement</h3>
                <div class="form-row">
                    <div class="form-group"><label>Title</label><input type="text" id="annTitle" placeholder="Announcement title"></div>
                    <div class="form-group"><label>Priority</label><select id="annPriority"><option value="Normal">Normal</option><option value="Important">Important</option><option value="Urgent">Urgent</option></select></div>
                    <div class="form-group full"><label>Content</label><textarea id="annContent" placeholder="Write your announcement..."></textarea></div>
                </div>
                <button class="btn-send" id="btnSend">📢 Send Announcement</button>
            </div>

            <div class="announcement-list" id="annList"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, getDocs, onSnapshot, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig={apiKey:"AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",authDomain:"futbtechfeast.firebaseapp.com",projectId:"futbtechfeast",storageBucket:"futbtechfeast.firebasestorage.app",messagingSenderId:"64095326173",appId:"1:64095326173:web:3f7cda8b0040ab2ea53034"};
        const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
        window.firebaseAuth=auth;window.firebaseDb=db;window.firebaseSignOut=signOut;window.firebaseDoc=doc;window.firebaseGetDoc=getDoc;window.firebaseCollection=collection;window.firebaseQuery=query;window.firebaseOrderBy=orderBy;window.firebaseGetDocs=getDocs;window.firebaseOnSnapshot=onSnapshot;window.firebaseUpdateDoc=updateDoc;window.firebaseDeleteDoc=deleteDoc;window.firebaseAddDoc=addDoc;window.firebaseServerTimestamp=serverTimestamp;
        console.log("✅ Firebase Admin initialized");
    </script>

    <script>
        let currentAdmin=null,allAnnouncements=[],currentPage=1,pageSize=10;
        const sidebar=document.getElementById('sidebar'),hamburgerBtn=document.getElementById('hamburgerBtn'),adminAvatar=document.getElementById('adminAvatar'),adminName=document.getElementById('adminName'),adminDropdown=document.getElementById('adminDropdown'),modalOverlay=document.getElementById('modalOverlay'),modalBox=document.getElementById('modalBox'),toast=document.getElementById('toast');

        hamburgerBtn.addEventListener('click',()=>sidebar.classList.toggle('open'));
        document.addEventListener('click',(e)=>{if(!e.target.closest('#sidebar')&&!e.target.closest('#hamburgerBtn')&&sidebar.classList.contains('open'))sidebar.classList.remove('open')});
        document.getElementById('adminPill').addEventListener('click',()=>adminDropdown.classList.toggle('active'));
        document.addEventListener('click',(e)=>{if(!e.target.closest('#adminPill')&&!e.target.closest('#adminDropdown'))adminDropdown.classList.remove('active')});
        document.getElementById('logoutBtn').addEventListener('click',async()=>{await window.firebaseSignOut(window.firebaseAuth);window.location.href='admin-login.html'});

        function waitForFirebase(cb){if(window.firebaseOnSnapshot&&window.firebaseAuth){cb()}else{setTimeout(()=>waitForFirebase(cb),150)}}
        waitForFirebase(()=>{window.firebaseOnAuthStateChanged(window.firebaseAuth,async(user)=>{if(!user){window.location.href='admin-login.html';return}const ad=await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDb,'admins',user.uid));if(!ad.exists()||ad.data().role!=='admin'){await window.firebaseSignOut(window.firebaseAuth);window.location.href='admin-login.html';return}currentAdmin=user;adminAvatar.textContent=(ad.data().name||'A').charAt(0).toUpperCase();adminName.textContent=ad.data().name||'Admin';loadAnnouncements()})});

        function loadAnnouncements(){window.firebaseOnSnapshot(window.firebaseQuery(window.firebaseCollection(window.firebaseDb,'announcements'),window.firebaseOrderBy('createdAt','desc')),(snap)=>{allAnnouncements=[];snap.forEach(doc=>allAnnouncements.push({id:doc.id,...doc.data()}));document.getElementById('totalBadge').textContent=allAnnouncements.length;renderList()})}

        document.getElementById('btnSend').addEventListener('click',async()=>{
            const title=document.getElementById('annTitle').value.trim(),content=document.getElementById('annContent').value.trim(),priority=document.getElementById('annPriority').value;
            if(!title||!content){showToast('Title and content required');return}
            await window.firebaseAddDoc(window.firebaseCollection(window.firebaseDb,'announcements'),{title,content,priority,createdAt:window.firebaseServerTimestamp()});
            document.getElementById('annTitle').value='';document.getElementById('annContent').value='';showToast('Announcement sent! 📢');
        });

        function renderList(){
            const start=(currentPage-1)*pageSize,end=start+pageSize,pageData=allAnnouncements.slice(start,end);
            const pc={Normal:'priority-normal',Important:'priority-important',Urgent:'priority-urgent'};
            document.getElementById('annList').innerHTML=pageData.length===0?'<p style="color:var(--muted);text-align:center;padding:3rem;">No announcements yet</p>':pageData.map(a=>'<div class="ann-card"><div class="ann-header"><span class="ann-title">'+a.title+'</span><span class="priority-badge '+(pc[a.priority]||'priority-normal')+'">'+(a.priority||'Normal')+'</span><span class="ann-date">'+((a.createdAt?.toDate?.()||new Date()).toLocaleDateString())+'</span></div><p class="ann-content">'+(a.content||'').substring(0,200)+(a.content&&a.content.length>200?'…':'')+'</p><div class="ann-actions"><button class="btn-sm" onclick="editAnnouncement(\''+a.id+'\')">✏️ Edit</button><button class="btn-sm danger" onclick="deleteAnnouncement(\''+a.id+'\')">🗑️ Delete</button></div><div class="edit-form" id="edit-'+a.id+'"></div></div>').join('');
            renderPagination();
        }

        function editAnnouncement(id){
            const a=allAnnouncements.find(a=>a.id===id);if(!a)return;
            const form=document.getElementById('edit-'+id);form.classList.toggle('active');
            form.innerHTML='<div class="form-row"><div class="form-group"><label>Title</label><input type="text" id="editTitle-'+id+'" value="'+(a.title||'')+'"></div><div class="form-group"><label>Priority</label><select id="editPriority-'+id+'"><option value="Normal" '+(a.priority==='Normal'?'selected':'')+'>Normal</option><option value="Important" '+(a.priority==='Important'?'selected':'')+'>Important</option><option value="Urgent" '+(a.priority==='Urgent'?'selected':'')+'>Urgent</option></select></div><div class="form-group full"><label>Content</label><textarea id="editContent-'+id+'">'+(a.content||'')+'</textarea></div></div><button class="btn-save-sm" onclick="saveEdit(\''+id+'\')">💾 Save</button><button class="btn-cancel-sm" onclick="document.getElementById(\'edit-'+id+'\').classList.remove(\'active\')">Cancel</button>';
        }

        async function saveEdit(id){
            const data={title:document.getElementById('editTitle-'+id).value,priority:document.getElementById('editPriority-'+id).value,content:document.getElementById('editContent-'+id).value};
            await window.firebaseUpdateDoc(window.firebaseDoc(window.firebaseDb,'announcements',id),data);
            document.getElementById('edit-'+id).classList.remove('active');showToast('Announcement updated!');
        }

        function deleteAnnouncement(id){
            const a=allAnnouncements.find(a=>a.id===id);if(!a)return;
            modalBox.innerHTML='<button class="modal-close" onclick="document.getElementById(\'modalOverlay\').classList.remove(\'active\')">✕</button><h3>🗑️ Delete Announcement?</h3><p style="color:var(--muted);">Delete "<strong>'+a.title+'</strong>"?</p><button class="btn-danger" id="btnConfirmDelete">Delete</button>';
            modalOverlay.classList.add('active');document.getElementById('btnConfirmDelete').addEventListener('click',async()=>{await window.firebaseDeleteDoc(window.firebaseDoc(window.firebaseDb,'announcements',id));modalOverlay.classList.remove('active');showToast('Announcement deleted!')});
        }

        function renderPagination(){const tp=Math.ceil(allAnnouncements.length/pageSize);let h='<button '+(currentPage===1?'disabled':'')+' onclick="goToPage('+(currentPage-1)+')">← Prev</button>';for(let i=1;i<=tp;i++){if(i===1||i===tp||Math.abs(i-currentPage)<=2)h+='<button class="'+(i===currentPage?'active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';else if(!h.endsWith('...'))h+='<span style="color:var(--muted);">...</span>'}h+='<button '+(currentPage===tp?'disabled':'')+' onclick="goToPage('+(currentPage+1)+')">Next →</button>';document.getElementById('pagination').innerHTML=tp>1?h:''}
        function goToPage(p){currentPage=p;renderList();window.scrollTo({top:0,behavior:'smooth'})}

        modalOverlay.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active')});
        document.addEventListener('keydown',function(e){if(e.key==='Escape')modalOverlay.classList.remove('active')});
        function showToast(m,d=3000){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),d)}

        window.editAnnouncement=editAnnouncement;window.saveEdit=saveEdit;window.deleteAnnouncement=deleteAnnouncement;window.goToPage=goToPage;
    </script>
</body>
</html>
