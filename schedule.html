<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Schedule — FUTB TechFest 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-blue:#060E1A;--navy:#0B1D3A;--navy-light:#142D5E;
            --teal:#0D9488;--teal-light:#14B8A6;--teal-pale:#CCFBF1;
            --sky:#38BDF8;--sky-light:#7DD3FC;--sky-pale:#E0F2FE;
            --white:#FFFFFF;--crimson:#EF4444;--green:#10B981;--orange:#F59E0B;
            --card:rgba(11,29,58,0.55);--glass:rgba(255,255,255,0.04);
            --border:rgba(56,189,248,0.2);--border-teal:rgba(20,184,166,0.4);
            --text:#E2E8F0;--text-bright:#F8FAFC;--muted:#94A3B8;--muted-light:#CBD5E1;
            --shadow-teal:0 0 30px rgba(20,184,166,0.15);
            --shadow-card:0 8px 40px rgba(0,0,0,0.3);
            --radius-sm:8px;--radius:12px;--radius-lg:20px;
            --transition:0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--teal) var(--deep-blue)}
        html::-webkit-scrollbar{width:6px}
        html::-webkit-scrollbar-track{background:var(--deep-blue)}
        html::-webkit-scrollbar-thumb{background:var(--teal);border-radius:3px}
        body{
            font-family:'Space Grotesk',sans-serif;background:var(--deep-blue);color:var(--text);
            min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:90px;position:relative;
        }
        body::before{
            content:'';position:fixed;inset:0;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events:none;z-index:0;opacity:0.3;
        }
        .top-nav{
            position:sticky;top:0;z-index:100;background:rgba(6,14,26,0.85);
            backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:0 5%;
            display:flex;align-items:center;justify-content:space-between;height:64px;
        }
        .nav-left{display:flex;align-items:center;gap:1rem}
        .back-btn{color:var(--muted);text-decoration:none;font-size:0.82rem;font-weight:500;letter-spacing:0.04em;transition:color var(--transition);display:flex;align-items:center;gap:0.3rem}
        .back-btn:hover{color:var(--teal-light)}
        .nav-logo{font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:0.08em;background:linear-gradient(135deg,var(--teal-light),var(--sky-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
        .user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;font-family:'JetBrains Mono',monospace;border:2px solid transparent;cursor:pointer;transition:all var(--transition);text-decoration:none}
        .user-avatar:hover{border-color:var(--teal-light);box-shadow:0 0 20px rgba(20,184,166,0.3)}
        .main-content{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:2rem 5%}
        .page-title{font-size:1.4rem;font-weight:700;color:var(--text-bright);margin-bottom:0.3rem}
        .page-subtitle{font-size:0.82rem;color:var(--muted);margin-bottom:0.5rem}
        .event-count-badge{display:inline-block;background:rgba(20,184,166,0.1);border:1px solid var(--border-teal);padding:0.3rem 0.8rem;border-radius:100px;font-size:0.7rem;color:var(--teal-light);font-family:'JetBrains Mono',monospace;letter-spacing:0.05em;margin-bottom:1.5rem}
        .live-banner{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.4);border-radius:var(--radius);padding:1.2rem 1.5rem;margin-bottom:1.5rem;display:none;align-items:center;gap:1rem;animation:pulse-border 2s infinite}
        .live-banner.active{display:flex}
        @keyframes pulse-border{0%,100%{border-color:rgba(239,68,68,0.4)}50%{border-color:rgba(239,68,68,0.8)}}
        .live-dot{width:14px;height:14px;border-radius:50%;background:var(--crimson);animation:pulse-dot 1s infinite;flex-shrink:0}
        @keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.6)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
        .live-banner-info{flex:1}
        .live-banner-info .live-label{font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--crimson);font-weight:700;margin-bottom:0.2rem}
        .live-banner-info h3{font-size:1rem;font-weight:700;color:var(--text-bright);margin-bottom:0.2rem}
        .live-banner-info p{font-size:0.75rem;color:var(--muted-light)}
        .day-tabs{display:flex;gap:0.6rem;margin-bottom:1.8rem;flex-wrap:wrap}
        .day-tab{flex:1;min-width:120px;padding:0.8rem 1.2rem;border-radius:var(--radius);text-align:center;cursor:pointer;transition:all var(--transition);border:1px solid var(--border);background:var(--glass);color:var(--muted);font-weight:600;font-size:0.82rem;font-family:'Space Grotesk',sans-serif}
        .day-tab:hover{border-color:var(--border-teal);color:var(--text-bright)}
        .day-tab.active{background:rgba(20,184,166,0.1);border-color:var(--teal-light);color:var(--teal-light)}
        .day-tab .tab-count{font-size:0.65rem;color:var(--muted);margin-top:0.2rem;font-family:'JetBrains Mono',monospace}
        .timeline{position:relative;padding-left:2rem}
        .timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--border),var(--border-teal),var(--border))}
        .timeline-item{position:relative;margin-bottom:1.2rem;padding-left:1.5rem}
        .timeline-dot{position:absolute;left:-1.65rem;top:0.5rem;width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--deep-blue);z-index:2;transition:all var(--transition)}
        .timeline-dot.live{background:var(--crimson);border-color:var(--crimson);animation:pulse-dot 1s infinite}
        .timeline-dot.upcoming{background:var(--teal-light);border-color:var(--teal-light)}
        .timeline-dot.completed{background:var(--green);border-color:var(--green)}
        .event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.5rem;cursor:pointer;transition:all var(--transition)}
        .event-card:hover{border-color:var(--border-teal);transform:translateX(4px)}
        .event-card.live-card{border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.04)}
        .event-card.completed-card{opacity:0.6}
        .event-card-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.6rem;margin-bottom:0.5rem}
        .event-time{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--teal-light);font-weight:700}
        .event-status-badge{padding:0.2rem 0.7rem;border-radius:100px;font-size:0.6rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
        .event-status-badge.live{background:rgba(239,68,68,0.15);color:var(--crimson);border:1px solid rgba(239,68,68,0.4)}
        .event-status-badge.upcoming{background:rgba(20,184,166,0.12);color:var(--teal-light);border:1px solid rgba(20,184,166,0.3)}
        .event-status-badge.completed{background:rgba(16,185,129,0.1);color:var(--green);border:1px solid rgba(16,185,129,0.3)}
        .event-body{display:flex;align-items:flex-start;gap:0.8rem}
        .event-icon{font-size:1.4rem;flex-shrink:0;width:36px;height:36px;background:rgba(20,184,166,0.08);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
        .event-info{flex:1}
        .event-info h4{font-size:0.88rem;font-weight:600;color:var(--text-bright);margin-bottom:0.2rem}
        .event-info .event-speaker{font-size:0.72rem;color:var(--teal-light);margin-bottom:0.2rem;font-style:italic}
        .event-info .event-desc{font-size:0.76rem;color:var(--muted-light);line-height:1.5;margin-bottom:0.3rem}
        .event-info .event-location{font-size:0.68rem;color:var(--muted);display:flex;align-items:center;gap:0.3rem}
        .modal-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all var(--transition);padding:1rem}
        .modal-overlay.active{opacity:1;visibility:visible}
        .modal-box{background:var(--navy);border:1px solid var(--border-teal);border-radius:var(--radius-lg);padding:2rem;max-width:480px;width:100%;position:relative;box-shadow:0 30px 70px rgba(0,0,0,0.6);transform:translateY(20px);transition:transform 0.5s cubic-bezier(0.4,0,0.2,1)}
        .modal-overlay.active .modal-box{transform:translateY(0)}
        .modal-close{position:absolute;top:1rem;right:1.2rem;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
        .modal-close:hover{color:var(--text-bright);background:rgba(255,255,255,0.06)}
        .modal-event-icon{font-size:3rem;text-align:center;margin-bottom:0.8rem}
        .modal-box h3{font-size:1.2rem;font-weight:700;color:var(--text-bright);text-align:center;margin-bottom:0.3rem}
        .modal-box .modal-speaker{font-size:0.8rem;color:var(--teal-light);text-align:center;margin-bottom:0.6rem;font-style:italic}
        .modal-box .modal-time{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--teal-light);text-align:center;margin-bottom:0.8rem}
        .modal-box .modal-desc{color:var(--muted-light);font-size:0.85rem;line-height:1.7;text-align:center;margin-bottom:0.8rem}
        .modal-box .modal-location{font-size:0.78rem;color:var(--muted);text-align:center;margin-bottom:1rem}
        .wa-banner{background:rgba(37,211,102,0.06);border:1px solid rgba(37,211,102,0.25);border-radius:var(--radius);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-top:2.5rem}
        .wa-banner p{font-size:0.82rem;color:var(--muted-light)}
        .btn-wa{background:#25D366;color:white;padding:0.6rem 1.5rem;border-radius:100px;font-weight:700;font-size:0.8rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;letter-spacing:0.04em;transition:all var(--transition)}
        .btn-wa:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(37,211,102,0.4)}
        .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(6,14,26,0.92);backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:0.6rem 5%;justify-content:space-around;align-items:center}
        .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:0.25rem;text-decoration:none;color:var(--muted);font-size:1.3rem;transition:all var(--transition);padding:0.3rem 0.6rem;border-radius:var(--radius-sm)}
        .bottom-nav a.active{color:var(--teal-light);background:rgba(20,184,166,0.1)}
        .bottom-nav a span{font-size:0.6rem;letter-spacing:0.05em;font-weight:500}
        .skeleton{background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);animation:pulse 1.5s infinite}
        .skeleton-text{height:14px;margin:8px 0;width:80%}.skeleton-text.short{width:50%}
        @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.7}}
        .empty-state{text-align:center;padding:3rem 2rem;color:var(--muted)}
        .empty-state .empty-icon{font-size:3rem;margin-bottom:1rem}
        @media(max-width:768px){.bottom-nav{display:flex}body{padding-bottom:80px}.main-content{padding:1.5rem 4%}.page-title{font-size:1.2rem}.live-banner{flex-direction:column;text-align:center}}
        @media(max-width:480px){.top-nav{padding:0 3%;height:56px}.nav-logo{font-size:1.1rem}.timeline{padding-left:1.5rem}.timeline-item{padding-left:1rem}.timeline-dot{left:-1.2rem}}
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-left">
            <a href="home.html" class="back-btn">← Dashboard</a>
            <a href="home.html" class="nav-logo">TechFest 2.0</a>
        </div>
        <a href="profile.html" class="user-avatar" id="userAvatar">U</a>
    </nav>

    <div class="main-content">
        <h1 class="page-title">📅 Event Schedule</h1>
        <p class="page-subtitle">Full 3-day programme — 21-23 July 2025</p>
        <div class="event-count-badge" id="eventCountBadge">Loading events...</div>

        <div class="live-banner" id="liveBanner">
            <div class="live-dot"></div>
            <div class="live-banner-info">
                <div class="live-label">🔴 Happening Now</div>
                <h3 id="liveTitle">—</h3>
                <p id="liveSpeaker">—</p>
            </div>
        </div>

        <div class="day-tabs">
            <button class="day-tab active" id="tabDay1">📅 Day 1 — 21 July<div class="tab-count" id="countDay1">0 events</div></button>
            <button class="day-tab" id="tabDay2">📅 Day 2 — 22 July<div class="tab-count" id="countDay2">0 events</div></button>
            <button class="day-tab" id="tabDay3">📅 Day 3 — 23 July<div class="tab-count" id="countDay3">0 events</div></button>
        </div>

        <div id="timelineContainer"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading schedule...</p></div></div>

        <div class="wa-banner">
            <p>📱 <strong>Join WhatsApp</strong> for schedule updates &amp; reminders</p>
            <a href="https://chat.whatsapp.com/JeeYoYCTGc18Au9rm299wz" target="_blank" class="btn-wa">📱 Join Group</a>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <a href="home.html">🏠<span>Home</span></a>
        <a href="my-registration.html">📝<span>Registration</span></a>
        <a href="orders.html">🛍️<span>Orders</span></a>
        <a href="profile.html">👤<span>Profile</span></a>
    </nav>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <div class="modal-event-icon" id="modalEventIcon">📋</div>
            <h3 id="modalEventTitle">Event Title</h3>
            <p class="modal-speaker" id="modalEventSpeaker"></p>
            <p class="modal-time" id="modalEventTime"></p>
            <p class="modal-desc" id="modalEventDesc"></p>
            <p class="modal-location" id="modalEventLocation"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBav34qgMsmY6bcPiXrJLVcS4si7NyOohM",
            authDomain: "futbtechfeast.firebaseapp.com",
            projectId: "futbtechfeast",
            storageBucket: "futbtechfeast.firebasestorage.app",
            messagingSenderId: "64095326173",
            appId: "1:64095326173:web:3f7cda8b0040ab2ea53034"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth=auth;window.firebaseDb=db;window.firebaseOnAuthStateChanged=onAuthStateChanged;
        window.firebaseCollection=collection;window.firebaseQuery=query;window.firebaseOrderBy=orderBy;window.firebaseOnSnapshot=onSnapshot;
        console.log("✅ Firebase initialized & exposed");
    </script>

    <script>
        let currentUser=null,allEvents=[],currentDay='Day 1';
        const userAvatar=document.getElementById('userAvatar'),liveBanner=document.getElementById('liveBanner'),liveTitle=document.getElementById('liveTitle'),liveSpeaker=document.getElementById('liveSpeaker');
        const timelineContainer=document.getElementById('timelineContainer'),eventCountBadge=document.getElementById('eventCountBadge');
        const tabDay1=document.getElementById('tabDay1'),tabDay2=document.getElementById('tabDay2'),tabDay3=document.getElementById('tabDay3');
        const countDay1=document.getElementById('countDay1'),countDay2=document.getElementById('countDay2'),countDay3=document.getElementById('countDay3');
        const modalOverlay=document.getElementById('modalOverlay');

        function waitForFirebase(cb){if(window.firebaseOnAuthStateChanged&&window.firebaseAuth){cb()}else{setTimeout(()=>waitForFirebase(cb),150)}}
        waitForFirebase(()=>{window.firebaseOnAuthStateChanged(window.firebaseAuth,(user)=>{if(!user){window.location.href='login.html';return}currentUser=user;userAvatar.textContent=(user.displayName||user.email||'U').charAt(0).toUpperCase();loadSchedule()})});

        function loadSchedule(){const q=window.firebaseQuery(window.firebaseCollection(window.firebaseDb,'schedule'),window.firebaseOrderBy('order'));window.firebaseOnSnapshot(q,(snapshot)=>{allEvents=[];snapshot.forEach(doc=>{allEvents.push({id:doc.id,...doc.data()})});console.log('✅ Schedule loaded:',allEvents.length,'events');updateLiveBanner();updateDayCounts();renderTimeline(currentDay)},(error)=>{console.error('❌ Schedule error:',error);timelineContainer.innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load schedule</p><button class="btn-wa" id="retryScheduleBtn" style="cursor:pointer;border:none;margin-top:1rem;">Retry</button></div>';document.getElementById('retryScheduleBtn')?.addEventListener('click',loadSchedule)})}
        function updateLiveBanner(){const le=allEvents.find(e=>e.status==='live');if(le){liveBanner.classList.add('active');liveTitle.textContent=(le.icon||'')+' '+le.title;liveSpeaker.textContent=(le.speaker?'Speaker: '+le.speaker:'')+' · '+le.time}else{liveBanner.classList.remove('active')}}
        function updateDayCounts(){const d1=allEvents.filter(e=>e.day==='Day 1').length,d2=allEvents.filter(e=>e.day==='Day 2').length,d3=allEvents.filter(e=>e.day==='Day 3').length;countDay1.textContent=d1+' event'+(d1!==1?'s':'');countDay2.textContent=d2+' event'+(d2!==1?'s':'');countDay3.textContent=d3+' event'+(d3!==1?'s':'');eventCountBadge.textContent=allEvents.length+' events across 3 days'}
        tabDay1.addEventListener('click',()=>{currentDay='Day 1';tabDay1.classList.add('active');tabDay2.classList.remove('active');tabDay3.classList.remove('active');renderTimeline('Day 1')});
        tabDay2.addEventListener('click',()=>{currentDay='Day 2';tabDay2.classList.add('active');tabDay1.classList.remove('active');tabDay3.classList.remove('active');renderTimeline('Day 2')});
        tabDay3.addEventListener('click',()=>{currentDay='Day 3';tabDay3.classList.add('active');tabDay1.classList.remove('active');tabDay2.classList.remove('active');renderTimeline('Day 3')});

        function renderTimeline(day){const de=allEvents.filter(e=>e.day===day);if(de.length===0){timelineContainer.innerHTML='<div class="empty-state"><div class="empty-icon">📅</div><p>Schedule coming soon!<br>The admin is preparing the programme.</p></div>';return}let h='<div class="timeline">';de.forEach(ev=>{const sc=ev.status||'upcoming',sl={live:'🔴 Live',upcoming:'Upcoming',completed:'Completed'}[sc]||'Upcoming',cc=ev.status==='live'?'live-card':ev.status==='completed'?'completed-card':'';h+='<div class="timeline-item"><div class="timeline-dot '+sc+'"></div><div class="event-card '+cc+'" data-eventid="'+ev.id+'"><div class="event-card-header"><span class="event-time">'+ev.time+'</span><span class="event-status-badge '+sc+'">'+sl+'</span></div><div class="event-body"><div class="event-icon">'+(ev.icon||'📌')+'</div><div class="event-info"><h4>'+ev.title+'</h4>'+(ev.speaker?'<p class="event-speaker">🎙️ '+ev.speaker+'</p>':'')+(ev.description?'<p class="event-desc">'+ev.description.substring(0,100)+(ev.description.length>100?'…':'')+'</p>':'')+(ev.location?'<p class="event-location">📍 '+ev.location+'</p>':'')+'</div></div></div></div>'});h+='</div>';timelineContainer.innerHTML=h;document.querySelectorAll('.event-card').forEach(card=>{card.addEventListener('click',function(){openEventModal(this.dataset.eventid)})})}
        function openEventModal(eid){const ev=allEvents.find(e=>e.id===eid);if(!ev)return;document.getElementById('modalEventIcon').textContent=ev.icon||'📌';document.getElementById('modalEventTitle').textContent=ev.title;document.getElementById('modalEventSpeaker').textContent=ev.speaker?'🎙️ '+ev.speaker:'';document.getElementById('modalEventTime').textContent=ev.time+' · '+(ev.day||'');document.getElementById('modalEventDesc').textContent=ev.description||'';document.getElementById('modalEventLocation').textContent=ev.location?'📍 '+ev.location:'';modalOverlay.classList.add('active');document.body.style.overflow='hidden'}
        function closeModal(){modalOverlay.classList.remove('active');document.body.style.overflow=''}
        document.getElementById('modalCloseBtn').addEventListener('click',closeModal);modalOverlay.addEventListener('click',function(e){if(e.target===this)closeModal()});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
    </script>
</body>
</html>
